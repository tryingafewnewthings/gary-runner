<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2f353f">
<title>Gary Eats: The Runner</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
:root{--w:min(100vw,calc(100vh*9/16))}
@supports(height:100dvh){:root{--w:min(100vw,calc(100dvh*9/16))}}
html,body{height:100%;background:#2f353f;overflow:hidden;touch-action:none}
body{display:flex;align-items:center;justify-content:center;font-family:'Arial Black',Impact,'Segoe UI',sans-serif;color:#fff}
#stage{--u:3.6px;position:relative;width:var(--w);height:calc(var(--w)*16/9);background:#111;overflow:hidden;box-shadow:0 0 0 1px #0006,0 0 70px #000a}
canvas{display:block;width:100%;height:100%;touch-action:none}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*3.5);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .5s ease,transform .5s ease,visibility 0s .5s}
.screen.show{opacity:1;visibility:visible;pointer-events:auto;transform:none;transition:opacity .5s ease,transform .5s ease,visibility 0s}
#menu{transform:scale(1.5);background:radial-gradient(ellipse at 50% 45%,rgba(10,12,24,.3),rgba(10,12,24,.82))}
#over{transform:scale(.92);background:rgba(8,10,20,.74);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);padding:0 calc(var(--u)*6)}
h1{text-align:center;font-size:calc(var(--u)*10.4);line-height:1.02;color:#fff36b;-webkit-text-stroke:calc(var(--u)*.45) #4a1200;paint-order:stroke fill;text-shadow:0 calc(var(--u)*.9) 0 #d3390b,0 0 calc(var(--u)*5) rgba(255,214,0,.75)}
h1 span{display:block}
h1 span+span{color:#ff6a3d}
#faceWrap{width:calc(var(--u)*46);height:calc(var(--u)*46);display:flex;align-items:center;justify-content:center;animation:bob 2.4s ease-in-out infinite;filter:drop-shadow(0 calc(var(--u)*1.5) calc(var(--u)*2) rgba(0,0,0,.6))}
#menuFace{max-width:100%;max-height:100%;object-fit:contain}
#menuFb{display:none;font-size:calc(var(--u)*32);align-items:center;justify-content:center}
@keyframes bob{0%,100%{transform:rotate(-9deg) scale(.93)}50%{transform:rotate(9deg) scale(1.09)}}
.arcade{font:inherit;font-size:calc(var(--u)*6.2);line-height:1.1;width:calc(var(--u)*84);padding:calc(var(--u)*3.6) calc(var(--u)*4);border:calc(var(--u)*.7) solid #fff;border-radius:calc(var(--u)*4.5);background:#eaff00;color:#1b1b1b;text-transform:uppercase;cursor:pointer;box-shadow:0 calc(var(--u)*1.6) 0 #8a9a00,0 0 calc(var(--u)*5) #eaff00;animation:pulse 1.1s ease-in-out infinite;transition:transform .08s}
.arcade:active{transform:translateY(calc(var(--u)*1.2));box-shadow:0 calc(var(--u)*.4) 0 #8a9a00,0 0 calc(var(--u)*3) #eaff00}
.arcade:focus-visible{outline:calc(var(--u)*.8) solid #fff;outline-offset:calc(var(--u)*.8)}
@keyframes pulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.18)}}
.hint{font:600 calc(var(--u)*3.3)/1.3 'Segoe UI',Arial,sans-serif;color:#cfd6e0;text-align:center;width:calc(var(--u)*80)}
h2{text-align:center;font-size:calc(var(--u)*15);line-height:1;color:#ff5a36;-webkit-text-stroke:calc(var(--u)*.5) #3a0a00;paint-order:stroke fill;text-shadow:0 calc(var(--u)*1) 0 #7c1d05}
h2 span{display:block;font-size:calc(var(--u)*8.5);color:#fff;margin-top:calc(var(--u)*1.5);-webkit-text-stroke:0;text-shadow:0 calc(var(--u)*.6) 0 #000a}
.stat{font-size:calc(var(--u)*5.2);text-align:center;line-height:1.25}
.stat small{display:block;font:700 calc(var(--u)*3.4) 'Segoe UI',Arial,sans-serif;color:#aab3c2}
.stat b{color:#ffe600;font-size:calc(var(--u)*11);display:block}
#fTier{font-size:calc(var(--u)*6.4);color:#39ff88}
#promo{width:100%;border:calc(var(--u)*.6) dashed #ffe600;background:rgba(255,230,0,.13);border-radius:calc(var(--u)*3);padding:calc(var(--u)*3);font:700 calc(var(--u)*4.2)/1.35 'Segoe UI',Arial,sans-serif;text-align:center}
#promo b{color:#ffe600;font-family:'Arial Black',Impact,sans-serif}
@media(prefers-reduced-motion:reduce){#faceWrap,.arcade{animation:none}.screen{transition:none}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>

  <div id="menu" class="screen show">
    <h1><span>GARY EATS:</span> <span>THE RUNNER</span></h1>
    <div id="faceWrap"><img id="menuFace" alt="Gary"><div id="menuFb">&#128523;</div></div>
    <button id="startBtn" class="arcade">LET'S GIVE IT A GO!</button>
    <p class="hint">Tap the left or right half of the screen, or use A / D or the arrow keys, to change lane.</p>
  </div>

  <div id="over" class="screen">
    <h2>STUFFED! <span>Game Over</span></h2>
    <div class="stat"><small>Final score</small><b id="fScore">0</b></div>
    <div class="stat"><small>Highest rating reached</small><span id="fTier"></span></div>
    <div id="promo">Use code <b>GARYEATS10</b> for 10% off your next takeaway!</div>
    <button id="againBtn" class="arcade">PLAY AGAIN</button>
  </div>
</div>

<script>
(()=>{
'use strict';
const W=360,H=640,HOR=175,CX=180,PB=.871,BASE=.42,BANDS=22;
const TIERS=[{n:'Standard Pub Grub',c:'#c4cad6'},{n:'Proper Decent',c:'#ffb02e'},{n:'BEAUTIFUL!',c:'#39ff88'}];
const FOODS={kebab:5,fish:10,roast:15};
const CAPS=['Look at the layers on that!','Unreal value!','Get a load of that gravy!'];
const BUB=["Right, that's","absolutely","ruined it!"];
const IMG='https://i.ibb.co/vxbrjJBT/IMG-6988.png';
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d'),stage=$('stage');

let K=1,state='menu',score=0,best=0,tierMax=0,lane=1,target=1,scroll=0,acc=0,gap=.3;
let objs=[],fx=[],cap=null,mile=0,shake=0,crashT=0,clock=0,uid=0;
try{best=+localStorage.getItem('garyBest')||0}catch(e){}

const tierOf=s=>s<100?0:s<=300?1:2;
const hw=p=>28+150*p, yy=p=>HOR+(H-HOR)*p, lx=(l,p)=>CX+(l-1)*(2*hw(p)/3);
const rnd=n=>{const x=Math.sin(n*127.1)*43758.5453;return x-Math.floor(x)};

/* ---------- image cache (decoded once into an offscreen bitmap) ---------- */
let spr=null,ar=1;
const face=new Image();
face.onload=()=>{
  if(!face.naturalWidth)return;
  ar=face.naturalWidth/face.naturalHeight;
  const h=Math.min(256,face.naturalHeight);
  spr=document.createElement('canvas');spr.height=h;spr.width=Math.round(h*ar);
  const c=spr.getContext('2d');c.imageSmoothingQuality='high';c.drawImage(face,0,0,spr.width,spr.height);
};
const noImg=()=>{$('menuFace').style.display='none';$('menuFb').style.display='flex'};
face.onerror=noImg;
$('menuFace').onerror=noImg;
face.src=IMG;$('menuFace').src=IMG;

/* ---------- vector sprites, pre-rendered once ---------- */
function mk(fn){const s=document.createElement('canvas');s.width=s.height=200;const c=s.getContext('2d');c.translate(100,100);c.scale(2,2);c.lineJoin='round';c.lineCap='round';fn(c);return s}
function dMush(c){
  c.fillStyle='#f5ecd0';c.strokeStyle='#3b1a12';c.lineWidth=3;
  c.beginPath();c.moveTo(-14,0);c.quadraticCurveTo(-19,38,-10,44);c.lineTo(10,44);c.quadraticCurveTo(19,38,14,0);c.closePath();c.fill();c.stroke();
  c.fillStyle='#e01e1e';
  c.beginPath();c.moveTo(-46,8);c.bezierCurveTo(-50,-52,50,-52,46,8);c.quadraticCurveTo(0,18,-46,8);c.closePath();c.fill();c.stroke();
  c.fillStyle='#fff';
  [[-22,-12,9],[8,-27,8],[26,-8,7],[-2,-8,5],[-34,-2,4]].forEach(([x,y,r])=>{c.beginPath();c.arc(x,y,r,0,7);c.fill()});
}
function dKebab(c){
  c.translate(0,6);c.lineWidth=3;c.strokeStyle='#4a2a10';
  c.fillStyle='#5aa832';[[-22,-6],[0,-14],[22,-6]].forEach(([x,y])=>{c.beginPath();c.ellipse(x,y,15,10,0,0,7);c.fill();c.stroke()});
  c.fillStyle='#8a4b22';[[-12,-16,-.3],[8,-20,.2],[-2,-8,0],[16,-10,.3]].forEach(([x,y,a])=>{c.beginPath();c.ellipse(x,y,14,8,a,0,7);c.fill();c.stroke()});
  c.fillStyle='#d8322c';[[-22,-14],[22,-16]].forEach(([x,y])=>{c.beginPath();c.ellipse(x,y,8,5,0,0,7);c.fill();c.stroke()});
  c.fillStyle='#f2cf8c';c.beginPath();c.ellipse(0,4,36,32,0,0,Math.PI);c.closePath();c.fill();c.stroke();
  c.strokeStyle='#fff';c.lineWidth=4;c.beginPath();c.moveTo(-22,-16);c.quadraticCurveTo(-8,-4,4,-18);c.quadraticCurveTo(14,-8,26,-14);c.stroke();
}
function dFish(c){
  c.lineWidth=3;c.strokeStyle='#4a3208';c.fillStyle='#ffd23f';
  [[-24,-4,-.35],[-12,-8,-.15],[2,-10,.05],[16,-8,.2],[28,-4,.4]].forEach(([x,y,a])=>{c.save();c.translate(x,y);c.rotate(a);c.fillRect(-4.5,-30,9,34);c.strokeRect(-4.5,-30,9,34);c.restore()});
  c.save();c.translate(-2,-8);c.rotate(-.45);c.fillStyle='#e9a23b';
  c.beginPath();c.ellipse(0,0,32,13,0,0,7);c.fill();c.stroke();
  c.beginPath();c.moveTo(30,0);c.lineTo(44,-10);c.lineTo(44,10);c.closePath();c.fill();c.stroke();
  c.fillStyle='#b8741f';[[-14,-3],[-2,4],[10,-4],[-6,-7],[16,3]].forEach(([x,y])=>{c.beginPath();c.arc(x,y,2.2,0,7);c.fill()});
  c.restore();
  c.fillStyle='#fff';c.beginPath();c.moveTo(-34,4);c.lineTo(34,4);c.lineTo(27,44);c.lineTo(-27,44);c.closePath();c.fill();
  c.fillStyle='#1f5fbf';
  [-26,-10,6,22].forEach(x=>{c.beginPath();c.moveTo(x,4);c.lineTo(x+8,4);c.lineTo((x+8)*.794,44);c.lineTo(x*.794,44);c.closePath();c.fill()});
  c.beginPath();c.moveTo(-34,4);c.lineTo(34,4);c.lineTo(27,44);c.lineTo(-27,44);c.closePath();c.stroke();
}
function dRoast(c){
  c.lineWidth=3;c.strokeStyle='#3a2a10';
  c.fillStyle='#fff';c.beginPath();c.ellipse(0,18,48,26,0,0,7);c.fill();c.stroke();
  c.fillStyle='#e6edf4';c.beginPath();c.ellipse(0,18,36,19,0,0,7);c.fill();
  c.fillStyle='#7a4318';c.beginPath();c.ellipse(4,21,27,12,0,0,7);c.fill();
  c.fillStyle='#f0b640';[[-30,12],[-22,24]].forEach(([x,y])=>{c.beginPath();c.ellipse(x,y,10,7,.3,0,7);c.fill();c.stroke()});
  c.fillStyle='#b4573f';[[-10,8,-.3],[4,5,.1]].forEach(([x,y,a])=>{c.save();c.translate(x,y);c.rotate(a);c.beginPath();c.ellipse(0,0,17,9,0,0,7);c.fill();c.stroke();c.restore()});
  c.fillStyle='#e9b04f';c.beginPath();c.moveTo(16,12);c.lineTo(20,-12);c.quadraticCurveTo(28,-22,37,-12);c.lineTo(41,12);c.quadraticCurveTo(28,20,16,12);c.closePath();c.fill();c.stroke();
  c.fillStyle='#4caf3a';[[-6,28],[2,32],[-14,32],[8,26]].forEach(([x,y])=>{c.beginPath();c.arc(x,y,4,0,7);c.fill()});
}
const SP={m:mk(dMush),kebab:mk(dKebab),fish:mk(dFish),roast:mk(dRoast)};

/* ---------- helpers ---------- */
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function q(a,b,c,d,e,f,g,h){ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(c,d);ctx.lineTo(e,f);ctx.lineTo(g,h);ctx.closePath();ctx.fill()}
function txt(s,x,y,size,col,al){ctx.font='900 '+size+'px "Arial Black",Impact,sans-serif';ctx.textAlign=al;ctx.textBaseline='middle';ctx.lineWidth=4;ctx.lineJoin='round';ctx.strokeStyle='rgba(0,0,0,.75)';ctx.strokeText(s,x,y);ctx.fillStyle=col;ctx.fillText(s,x,y)}
function fbFace(c,r){
  c.fillStyle='#ffd166';c.strokeStyle='#4a2a10';c.lineWidth=4;
  c.beginPath();c.arc(0,-r,r,0,7);c.fill();c.stroke();
  c.fillStyle='#222';c.beginPath();c.arc(-r*.35,-r*1.15,r*.1,0,7);c.arc(r*.35,-r*1.15,r*.1,0,7);c.fill();
  c.beginPath();c.arc(0,-r*.85,r*.5,.15*Math.PI,.85*Math.PI);c.stroke();
}

/* ---------- game flow ---------- */
function reset(){score=0;tierMax=0;lane=target=1;scroll=0;acc=0;gap=.3;objs=[];fx=[];cap=null;mile=0;shake=0;crashT=0}
function move(d){if(state==='play')target=Math.max(0,Math.min(2,target+d))}
function spawnRow(){
  const L=[0,1,2].sort(()=>Math.random()-.5);let i=0;
  const add=(l,t)=>objs.push({t,l,z:.02,id:uid++});
  const food=()=>{const r=Math.random();return r<.45?'kebab':r<.8?'fish':'roast'};
  const hasM=Math.random()<.5;
  if(hasM)add(L[i++],'m');
  const nf=hasM?(Math.random()<.6?1:0):(Math.random()<.5?1:2);
  for(let k=0;k<nf;k++)add(L[i++],food());
}
function collect(o){
  const pts=FOODS[o.t];score+=pts;
  fx.push({x:lx(lane,PB),y:yy(PB)-125,t:0,life:.85,txt:'+'+pts});
  tierMax=Math.max(tierMax,tierOf(score));
  while(Math.floor(score/50)>mile){mile++;cap={s:CAPS[Math.floor(Math.random()*CAPS.length)],t:0}}
}
function crash(){state='crash';crashT=0;shake=14;cap=null}
function endGame(){
  state='over';
  if(score>best){best=score;try{localStorage.setItem('garyBest',best)}catch(e){}}
  $('fScore').textContent=score;
  const T=TIERS[tierMax];$('fTier').textContent=T.n;$('fTier').style.color=T.c;
  $('over').classList.add('show');
}
function update(dt){
  clock+=dt;
  lane+=(target-lane)*Math.min(1,dt*14);
  if(cap){cap.t+=dt;if(cap.t>1.8)cap=null}
  for(const f of fx)f.t+=dt;
  fx=fx.filter(f=>f.t<f.life);
  if(state==='menu'){scroll+=.22*dt*BANDS;return}
  if(state==='crash'){crashT+=dt;shake=Math.max(0,shake-dt*22);if(crashT>1.7)endGame();return}
  if(state!=='play')return;
  const spd=BASE*Math.pow(1.15,Math.floor(score/100));
  scroll+=spd*dt*BANDS;acc+=spd*dt;
  if(acc>=gap){acc-=gap;gap=.28+Math.random()*.14;spawnRow()}
  for(const o of objs){
    o.z+=spd*dt;const p=o.z*o.z;
    if(!o.d&&p>.82&&p<.95&&Math.abs(lane-o.l)<.62){
      o.d=1;
      if(o.t==='m'){crash();return}
      collect(o);
    }
  }
  objs=objs.filter(o=>!o.d&&o.z<1.1);
}

/* ---------- rendering ---------- */
function drawRoad(){
  let g=ctx.createLinearGradient(0,0,0,HOR);
  g.addColorStop(0,'#1a2246');g.addColorStop(.6,'#7a3f7a');g.addColorStop(1,'#ffab5e');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,HOR);
  ctx.fillStyle='#ffe08a';ctx.beginPath();ctx.arc(CX,HOR,46,Math.PI,0);ctx.fill();
  ctx.fillStyle='#161a2b';
  [[0,30,28],[28,52,20],[48,24,30],[78,44,22],[100,20,26],[262,36,30],[292,54,24],[316,28,20],[336,46,24]].forEach(([x,h,w])=>ctx.fillRect(x,HOR-h,w,h));
  ctx.fillStyle='#1d2a25';ctx.fillRect(0,HOR,W,H-HOR);
  ctx.fillStyle='#3b3e46';q(CX-28,HOR,CX+28,HOR,CX+178,H,CX-178,H);
  const f=Math.floor(scroll),ph=scroll-f;
  for(let i=-1;i<BANDS;i++){
    const z0=Math.max(0,(i+ph)/BANDS),z1=(i+1+ph)/BANDS,p0=z0*z0,p1=z1*z1;
    if(p1<=p0)continue;
    const id=i-f,y0=yy(p0),y1=yy(p1)+.6,h0=hw(p0),h1=hw(p1),c0=h0*.07,c1=h1*.07,odd=id&1;
    ctx.fillStyle=odd?'#3b3e46':'#464a54';q(CX-h0,y0,CX+h0,y0,CX+h1,y1,CX-h1,y1);
    for(let s=0;s<6;s++){
      const u=rnd(id*7.1+s*13.7)*2-1,v=rnd(id*3.3+s*5.9),p=p0+(p1-p0)*v,r=.6+p*1.8;
      ctx.fillStyle=rnd(id+s*2.7)>.5?'rgba(255,255,255,.10)':'rgba(0,0,0,.2)';
      ctx.fillRect(CX+u*hw(p)*.95,yy(p),r*1.6,r);
    }
    ctx.fillStyle=odd?'#d8232a':'#f4f4f4';
    q(CX+h0,y0,CX+h0+c0,y0,CX+h1+c1,y1,CX+h1,y1);
    q(CX-h0,y0,CX-h0-c0,y0,CX-h1-c1,y1,CX-h1,y1);
    if(!odd){
      const d0=h0*.012+.4,d1=h1*.012+.4;ctx.fillStyle='rgba(255,255,255,.78)';
      for(const s of[-1,1])q(CX+s*h0/3-d0,y0,CX+s*h0/3+d0,y0,CX+s*h1/3+d1,y1,CX+s*h1/3-d1,y1);
    }
  }
  g=ctx.createLinearGradient(0,HOR,0,HOR+90);g.addColorStop(0,'rgba(255,171,94,.4)');g.addColorStop(1,'rgba(255,171,94,0)');
  ctx.fillStyle=g;ctx.fillRect(0,HOR,W,90);
}
function drawObj(o){
  const p=o.z*o.z;if(p<.002)return;
  const y=yy(p),x=lx(o.l,p),w=96*(.1+.9*p),m=o.t==='m';
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(x,y,w*.38,w*.09,0,0,7);ctx.fill();
  const bob=m?0:Math.sin(clock*5+o.id)*w*.05;
  if(!m){ctx.fillStyle='rgba(255,226,120,.22)';ctx.beginPath();ctx.arc(x,y-w*.45+bob,w*.62,0,7);ctx.fill()}
  ctx.drawImage(SP[o.t],x-w/2,y-w*.94+bob,w,w);
}
function drawPlayer(){
  const px=lx(lane,PB),yb=yy(PB),bob=state==='play'?Math.abs(Math.sin(clock*9))*5:0;
  let h=112,w=h;
  if(spr){w=h*ar;if(w>104){w=104;h=w/ar}}
  ctx.fillStyle='rgba(0,0,0,.38)';ctx.beginPath();ctx.ellipse(px,yb+2,w*.42,9,0,0,7);ctx.fill();
  ctx.save();ctx.translate(px,yb-bob);ctx.rotate((target-lane)*.12);
  if(spr)ctx.drawImage(spr,-w/2,-h,w,h);else fbFace(ctx,50);
  ctx.restore();
}
function drawHud(){
  const T=TIERS[tierOf(score)];
  ctx.fillStyle='rgba(10,12,20,.74)';rr(ctx,18,14,324,36,18);ctx.fill();
  ctx.strokeStyle=T.c;ctx.lineWidth=3;ctx.stroke();
  txt('Rating: '+T.n,CX,32,14,T.c,'center');
  txt('SCORE '+score,20,74,20,'#fff','left');
  txt('BEST '+best,340,74,13,'#cfd6e0','right');
}
function drawCap(){
  if(!cap)return;
  const t=cap.t,a=t>1.4?1-(t-1.4)/.4:1,pop=1+.5*Math.max(0,1-t*6);
  ctx.save();ctx.globalAlpha=Math.max(0,a);
  ctx.translate(CX+(t<.25?(1-t*4)*-170:0),265+Math.sin(t*8)*4);ctx.rotate(-.05);
  ctx.font='900 26px "Courier New",monospace';ctx.textAlign='center';ctx.textBaseline='middle';
  const fit=Math.min(1,326/ctx.measureText(cap.s).width)*pop;ctx.scale(fit,fit);
  ctx.lineJoin='round';ctx.lineWidth=9;ctx.strokeStyle='#20064a';ctx.strokeText(cap.s,0,0);
  ctx.fillStyle='#ff2d95';ctx.fillText(cap.s,3,3);
  ctx.fillStyle=Math.floor(t*10)%2?'#fff35c':'#5cf4ff';ctx.fillText(cap.s,0,0);
  ctx.restore();
}
function drawBubble(){
  const s=Math.min(1,crashT*6),px=lx(lane,PB),bx=Math.max(115,Math.min(245,px)),by=392,bw=210,bh=100;
  ctx.save();ctx.translate(bx,by);ctx.scale(s,s);ctx.rotate(-.04);
  const tx=Math.max(-70,Math.min(70,px-bx)),ty=yy(PB)-124-by;
  ctx.fillStyle='#fff';ctx.strokeStyle='#111';ctx.lineWidth=4;ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(-14,bh/2-2);ctx.lineTo(tx,ty);ctx.lineTo(14,bh/2-2);ctx.closePath();ctx.fill();ctx.stroke();
  rr(ctx,-bw/2,-bh/2,bw,bh,24);ctx.fill();ctx.stroke();
  ctx.fillStyle='#fff';ctx.fillRect(-12,bh/2-4,24,7);
  ctx.fillStyle='#111';ctx.font='900 21px "Comic Sans MS","Chalkboard SE","Arial Black",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  BUB.forEach((l,i)=>ctx.fillText(l,0,(i-1)*26));
  ctx.restore();
}
function render(){
  ctx.setTransform(K,0,0,K,0,0);
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  drawRoad();
  if(state!=='menu'){
    for(let i=objs.length-1;i>=0;i--)drawObj(objs[i]);
    drawPlayer();
    for(const f of fx){
      const k=f.t/f.life;ctx.save();ctx.globalAlpha=1-k;
      ctx.strokeStyle='#ffe600';ctx.lineWidth=3;ctx.beginPath();ctx.arc(f.x,f.y+30,10+k*44,0,7);ctx.stroke();
      ctx.restore();ctx.save();ctx.globalAlpha=1-k*k;txt(f.txt,f.x,f.y-k*40,24,'#ffe600','center');ctx.restore();
    }
  }
  ctx.restore();
  if(state!=='menu'){
    drawHud();drawCap();
    if(state==='crash'||state==='over'){
      if(state==='crash'){ctx.fillStyle='rgba(255,40,40,'+Math.max(0,.45-crashT)+')';ctx.fillRect(0,0,W,H)}
      drawBubble();
    }
  }
}

/* ---------- input & bootstrap ---------- */
addEventListener('keydown',e=>{
  if(e.repeat)return;
  const k=e.key.toLowerCase();
  if(k==='arrowleft'||k==='a')move(-1);
  else if(k==='arrowright'||k==='d')move(1);
  else return;
  if(state==='play')e.preventDefault();
});
cv.addEventListener('pointerdown',e=>{
  if(state!=='play')return;
  const r=cv.getBoundingClientRect();
  move(e.clientX-r.left<r.width/2?-1:1);
  e.preventDefault();
});
$('startBtn').addEventListener('click',e=>{
  e.currentTarget.blur();reset();state='play';$('menu').classList.remove('show');
});
$('againBtn').addEventListener('click',e=>{
  e.currentTarget.blur();$('over').classList.remove('show');reset();state='menu';$('menu').classList.add('show');
});
function resize(){
  const w=stage.clientWidth,dpr=Math.min(window.devicePixelRatio||1,2.5);
  cv.width=Math.round(w*dpr);cv.height=Math.round(w*16/9*dpr);K=cv.width/W;
  stage.style.setProperty('--u',w/100+'px');
  ctx.imageSmoothingQuality='high';
}
let last=performance.now();
function loop(ts){
  const dt=Math.max(0,Math.min(.05,(ts-last)/1000));last=ts;
  update(dt);render();requestAnimationFrame(loop);
}
addEventListener('resize',resize);
resize();requestAnimationFrame(loop);
})();
</script>
</body>
