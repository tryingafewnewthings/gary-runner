<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Gary Eats! — Professional Edition</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    body {
      margin: 0; padding: 0; background: #0a0c14; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex; justify-content: center; align-items: center;
      height: 100vh; height: 100dvh; overflow: hidden;
    }
    #stage {
      position: relative; width: 100%; max-width: 420px; height: 100%; max-height: 850px;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      background: #111; box-shadow: 0 12px 40px rgba(0,0,0,0.7); overflow: hidden;
    }
    canvas {
      display: block; width: 100%; height: auto; touch-action: none; background: #1a1e24;
    }
    .overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(10, 12, 20, 0.95); display: flex; flex-direction: column;
      justify-content: center; align-items: center; opacity: 0; pointer-events: none;
      transition: opacity 0.5s ease-in-out; z-index: 10; padding: 30px; text-align: center;
    }
    .overlay.show { opacity: 1; pointer-events: auto; }
    h1 { font-size: 2.2rem; margin: 0 0 12px 0; color: #ffe600; text-transform: uppercase; font-weight: 900; letter-spacing: -0.5px; }
    p { font-size: 1rem; margin: 0 0 25px 0; color: #cfd6e0; line-height: 1.4; }
    button {
      background: #ffe600; color: #111; border: none; padding: 16px 42px;
      font-size: 1.05rem; font-weight: 900; border-radius: 32px; cursor: pointer;
      text-transform: uppercase; box-shadow: 0 6px 24px rgba(255,230,0,0.35);
      transition: transform 0.1s ease, background 0.2s ease;
    }
    button:active { transform: scale(0.96); background: #e5ce00; }
    
    /* Semi-transparent white background for intro */
    #introOverlay { background: rgba(255, 255, 255, 0.85); }
    
    .profile-img { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; border: 4px solid #ffe600; margin-bottom: 16px; box-shadow: 0 6px 20px rgba(0,0,0,0.5); }
    
    #introAvatar {
      width: 180px; height: 180px; border-radius: 50%;
    }
  </style>
</head>
<body>

  <div id="stage">
    <canvas id="c"></canvas>
    
    <!-- Audio source -->
    <audio id="garyAudio" src="gary_audio.mp3" preload="auto"></audio>

    <!-- Main Menu -->
    <div id="menu" class="overlay show">
      <!-- Updated PNG extensions -->
      <img class="profile-img" src="gary_closed.png.PNG" alt="Gary" onerror="this.src='gary_open.png.PNG'">
      <h1>Gary Eats!</h1>
      <p>Navigate the high street, dodge hazards, and collect proper decent grub.</p>
      <button id="startBtn">Play Game</button>
    </div>

    <!-- Audio Intro Screen (Clean with just Gary) -->
    <div id="introOverlay" class="overlay">
      <canvas id="introAvatar" width="180" height="180"></canvas>
    </div>

    <!-- Game Over Overlay -->
    <div id="over" class="overlay">
      <h1>Proper Ruined!</h1>
      <p id="fScore">Score: 0</p>
      <p id="fTier">Tier: Absolute Rubbish</p>
      <button id="againBtn">Try Again</button>
    </div>
  </div>

<script>
(() => {
'use strict';
const W = 360, H = 640, CX = 180;
const ROAD_LEFT = 75, ROAD_RIGHT = 285, ROAD_WIDTH = 210;
const LANE_WIDTH = ROAD_WIDTH / 3;
const PLAYER_Y = 540;

const TIERS = [
  { n: 'Absolute Rubbish', c: '#ff4d4d' },
  { n: 'Bit Dry, Needs Salt', c: '#ffb02e' },
  { n: 'Proper Decent Food', c: '#39ff88' },
  { n: 'BEAUTIFUL!', c: '#00ffff' },
  { n: "I'll have to bring Danny here one day", c: '#ffe600' }
];

const FOODS = { kebab: 5, fish: 10, roast: 25 };
const CAPS = [
  "Look at the absolute size of that portion, fellas! Phrwoar.",
  "The crackling is elite.",
  "Swimming in proper thick gravy. Get a load of that.",
  "That is an absolute unit of a pie."
];

const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv ? cv.getContext('2d') : null, stage = $('stage');
const garyAudio = $('garyAudio');
const introAvatarCv = $('introAvatar'), introCtx = introAvatarCv.getContext('2d');

let K = 1, state = 'menu', score = 0, best = 0, tierMax = 0, lane = 1, target = 1, scrollY = 0, acc = 0, gap = 160;
let objs = [], fx = [], cap = null, mile = 0, crashT = 0, clock = 0, uid = 0;
let grinTimer = 0, stars = [];
let lastTierIndex = 0;

let audioCtx, analyser, dataArray;
let animTimer = 0, currentFrame = 0;

let openLoaded = false, closedLoaded = false;
let loadErrorLog = [];

// Updated PNG extensions
const imgOpen = new Image();
imgOpen.onload = () => { openLoaded = true; };
imgOpen.onerror = () => { loadErrorLog.push('gary_open.png.PNG not found'); };
imgOpen.src = 'gary_open.png.PNG';

const imgClosed = new Image();
imgClosed.onload = () => { closedLoaded = true; };
imgClosed.onerror = () => { loadErrorLog.push('gary_closed.png.PNG not found'); };
imgClosed.src = 'gary_closed.png.PNG';

function getActiveImage(isOpen) {
  if (isOpen && openLoaded) return imgOpen;
  if (!isOpen && closedLoaded) return imgClosed;
  if (openLoaded) return imgOpen;
  if (closedLoaded) return imgClosed;
  return null;
}

function initAudio() {
  if (audioCtx) return;
  try {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AudioContext();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    dataArray = new Uint8Array(analyser.frequencyBinCount);
    
    const source = audioCtx.createMediaElementSource(garyAudio);
    source.connect(analyser);
    analyser.connect(audioCtx.destination);
  } catch(e) {
    console.warn("Audio Context init error:", e);
  }
}

try { best = +localStorage.getItem('garyBest') || 0; } catch(e){}

function tierOf(s) {
  if (s <= 50) return 0;
  if (s <= 150) return 1;
  if (s <= 300) return 2;
  if (s <= 500) return 3;
  return 4;
}

function lx(l) { return ROAD_LEFT + (l + 0.5) * LANE_WIDTH; }

function mk(fn) {
  const s = document.createElement('canvas');
  s.width = s.height = 120;
  const c = s.getContext('2d');
  c.translate(60, 60); c.lineJoin = 'round'; c.lineCap = 'round';
  fn(c); return s;
}

function dMush(c) {
  c.lineWidth = 3; c.strokeStyle = '#2b1810'; c.fillStyle = '#f5eedc';
  c.beginPath(); c.moveTo(-12, 5); c.lineTo(-10, 38); c.lineTo(10, 38); c.lineTo(12, 5); c.closePath(); c.fill(); c.stroke();
  c.fillStyle = '#8a5a36'; c.beginPath(); c.arc(0, 5, 32, Math.PI, 0); c.closePath(); c.fill(); c.stroke();
}
function dFork(c) {
  c.lineWidth = 3; c.strokeStyle = '#a0b0c0'; c.fillStyle = '#e8f2fc';
  c.beginPath(); c.fillRect(-6, -10, 12, 48); c.strokeRect(-6, -10, 12, 48);
  [-14, -6, 2, 10].forEach(x => { c.fillRect(x, -42, 4, 34); c.strokeRect(x, -42, 4, 34); });
  c.fillRect(-16, -12, 32, 8); c.strokeRect(-16, -12, 32, 8);
}
function dKebab(c) {
  c.lineWidth = 3; c.strokeStyle = '#4a2a10';
  c.fillStyle = '#5aa832'; [[-18, -6], [0, -12], [18, -6]].forEach(([x, y]) => { c.beginPath(); c.ellipse(x, y, 12, 8, 0, 0, 7); c.fill(); c.stroke(); });
  c.fillStyle = '#8a4b22'; [[-10, -14], [6, -16], [-2, -6], [12, -8]].forEach(([x, y]) => { c.beginPath(); c.ellipse(x, y, 11, 6, 0, 0, 7); c.fill(); c.stroke(); });
  c.fillStyle = '#d8322c'; [[-16, -12], [16, -14]].forEach(([x, y]) => { c.beginPath(); c.ellipse(x, y, 6, 4, 0, 0, 7); c.fill(); c.stroke(); });
  c.fillStyle = '#f2cf8c'; c.beginPath(); c.ellipse(0, 4, 28, 24, 0, 0, Math.PI); c.closePath(); c.fill(); c.stroke();
}
function dFish(c) {
  c.lineWidth = 3; c.strokeStyle = '#4a3208'; c.fillStyle = '#ffd23f';
  [[-18, -3, -.3], [-8, -6, -.1], [2, -8, .05], [12, -6, .2], [22, -3, .4]].forEach(([x, y, a]) => {
    c.save(); c.translate(x, y); c.rotate(a); c.fillRect(-3.5, -22, 7, 26); c.strokeRect(-3.5, -22, 7, 26); c.restore();
  });
  c.save(); c.translate(-2, -6); c.rotate(-.45); c.fillStyle = '#e9a23b';
  c.beginPath(); c.ellipse(0, 0, 24, 10, 0, 0, 7); c.fill(); c.stroke();
  c.beginPath(); c.moveTo(22, 0); c.lineTo(32, -8); c.lineTo(32, 8); c.closePath(); c.fill(); c.stroke();
  c.restore();
  c.fillStyle = '#fff'; c.beginPath(); c.moveTo(-26, 3); c.lineTo(26, 3); c.lineTo(20, 32); c.lineTo(-20, 32); c.closePath(); c.fill();
  c.fillStyle = '#1f5fbf';
  [-20, -8, 4, 16].forEach(x => { c.beginPath(); c.moveTo(x, 3); c.lineTo(x + 6, 3); c.lineTo((x + 6) * .79, 32); c.lineTo(x * .79, 32); c.closePath(); c.fill(); });
  c.beginPath(); c.moveTo(-26, 3); c.lineTo(26, 3); c.lineTo(20, 32); c.lineTo(-20, 32); c.closePath(); c.stroke();
}
function dRoast(c) {
  c.lineWidth = 3; c.strokeStyle = '#3a2a10';
  c.fillStyle = '#fff'; c.beginPath(); c.ellipse(0, 12, 38, 20, 0, 0, 7); c.fill(); c.stroke();
  c.fillStyle = '#e6edf4'; c.beginPath(); c.ellipse(0, 12, 28, 15, 0, 0, 7); c.fill();
  c.fillStyle = '#7a4318'; c.beginPath(); c.ellipse(3, 14, 21, 9, 0, 0, 7); c.fill();
  c.fillStyle = '#f0b640'; [[-24, 8], [-18, 16]].forEach(([x, y]) => { c.beginPath(); c.ellipse(x, y, 8, 5, .3, 0, 7); c.fill(); c.stroke(); });
  c.fillStyle = '#b4573f'; [[-8, 5, -.3], [3, 3, .1]].forEach(([x, y, a]) => { c.save(); c.translate(x, y); c.rotate(a); c.beginPath(); c.ellipse(0, 0, 13, 7, 0, 0, 7); c.fill(); c.stroke(); c.restore(); });
  c.fillStyle = '#e9b04f'; c.beginPath(); c.moveTo(12, 8); c.lineTo(15, -10); c.quadraticCurveTo(22, -18, 29, -10); c.lineTo(32, 8); c.quadraticCurveTo(22, 14, 12, 8); c.closePath(); c.fill(); c.stroke();
  c.fillStyle = '#4caf3a'; [[-5, 20], [2, 23], [-11, 23], [6, 18]].forEach(([x, y]) => { c.beginPath(); c.arc(x, y, 3, 0, 7); c.fill(); });
}

const SP = { m: mk(dMush), fork: mk(dFork), kebab: mk(dKebab), fish: mk(dFish), roast: mk(dRoast) };

function rr(c, x, y, w, h, r) {
  c.beginPath(); c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

function txt(s, x, y, size, col, al) {
  ctx.font = '900 ' + size + 'px "Arial Black",Impact,sans-serif';
  ctx.textAlign = al; ctx.textBaseline = 'middle';
  ctx.lineWidth = 4; ctx.lineJoin = 'round'; ctx.strokeStyle = 'rgba(0,0,0,.85)';
  ctx.strokeText(s, x, y); ctx.fillStyle = col; ctx.fillText(s, x, y);
}

function fbFace(c, r) {
  c.fillStyle = '#ffd166'; c.strokeStyle = '#4a2a10'; c.lineWidth = 4;
  c.beginPath(); c.arc(0, 0, r, 0, Math.PI * 2); c.fill(); c.stroke();
  c.fillStyle = '#222'; c.beginPath(); c.arc(-r * .35, -r * .2, r * .12, 0, Math.PI * 2); c.arc(r * .35, -r * .2, r * .12, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.arc(0, 0, r * .5, .15 * Math.PI, .85 * Math.PI); c.stroke();
}

function triggerGrin() {
  grinTimer = 1.3;
  const px = lx(lane);
  for (let i = 0; i < 20; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 40 + Math.random() * 90;
    const side = Math.random() < 0.5 ? -30 : 30;
    stars.push({ x: px + side, y: PLAYER_Y - 35, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: 0.6 + Math.random() * 0.5, maxLife: 1.1, size: 4 + Math.random() * 5 });
  }
}

function reset() {
  score = 0; tierMax = 0; lastTierIndex = 0; lane = target = 1; scrollY = 0; acc = 0; gap = 160;
  objs = []; fx = []; cap = null; mile = 0; crashT = 0; grinTimer = 0; stars = [];
}

function move(d) {
  if (state === 'play') target = Math.max(0, Math.min(2, target + d));
}

function spawnRow() {
  const L = [0, 1, 2].sort(() => Math.random() - .5);
  let i = 0;
  const add = (l, t) => objs.push({ t, l, y: -60, id: uid++ });
  const food = () => { const r = Math.random(); return r < .45 ? 'kebab' : r < .8 ? 'fish' : 'roast'; };
  const hazardType = () => Math.random() < 0.5 ? 'm' : 'fork';
  const hasH = Math.random() < .55;
  if (hasH) add(L[i++], hazardType());
  const nf = hasH ? (Math.random() < .6 ? 1 : 0) : (Math.random() < .5 ? 1 : 2);
  for (let k = 0; k < nf; k++) add(L[i++], food());
}

function collect(o) {
  const pts = FOODS[o.t];
  score += pts;
  fx.push({ x: lx(o.l), y: o.y, t: 0, life: 1.5, txt: '+' + pts });
  const currentTier = tierOf(score);
  let grin = o.t === 'roast';
  if (currentTier > lastTierIndex) { lastTierIndex = currentTier; grin = true; }
  if (grin) triggerGrin();
  tierMax = Math.max(tierMax, currentTier);
  if (score >= (mile + 1) * 40) {
    mile = Math.floor(score / 40);
    cap = { s: CAPS[Math.floor(Math.random() * CAPS.length)], t: 0 };
  }
}

function crash(hitType) {
  crashT = 0; cap = null;
  if (hitType === 'fork') {
    cap = { s: "You can't tackle a premium dinner with a plastic fork! Unprofessional!", t: 0, life: 3.5 };
  } else {
    cap = { s: "Absolute Rubbish!", t: 0, life: 3 };
  }
  const currentBest = +localStorage.getItem('garyBest') || 0;
  if (score > currentBest) { best = score; localStorage.setItem('garyBest', best); }
  $('fScore').innerText = 'Score: ' + score;
  $('fTier').innerText = 'Tier: ' + TIERS[tierOf(score)].n;
  $('fTier').style.color = TIERS[tierOf(score)].c;
  setTimeout(() => { state = 'over'; $('over').classList.add('show'); }, hitType === 'fork' ? 3000 : 1800);
  state = 'crashing';
}

// Analyser data processing: lowered threshold to 12
function isTalkingAudio() {
  if (analyser && !garyAudio.paused) {
    analyser.getByteFrequencyData(dataArray);
    let sum = 0;
    for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
    return (sum / dataArray.length) > 12; // Lowered from 18 to trigger more frequently
  }
  return false;
}

function drawIntroAvatar(dt) {
  introCtx.clearRect(0, 0, 180, 180);
  let isOpen = isTalkingAudio();
  
  if (!garyAudio.paused && !analyser) {
    animTimer += dt;
    if (animTimer > 0.15) {
      animTimer = 0;
      currentFrame = (currentFrame + 1) % 2;
    }
    isOpen = currentFrame === 1;
  }
  
  const img = getActiveImage(isOpen);
  if (img) {
    introCtx.save();
    introCtx.beginPath();
    introCtx.arc(90, 90, 86, 0, Math.PI * 2);
    introCtx.clip();
    introCtx.drawImage(img, 0, 0, 180, 180);
    introCtx.restore();
    introCtx.lineWidth = 8;
    introCtx.strokeStyle = '#ffe600';
    introCtx.stroke();
  } else {
    introCtx.save();
    introCtx.translate(90, 90);
    fbFace(introCtx, 86);
    if (isOpen) {
      introCtx.fillStyle = '#222';
      introCtx.beginPath();
      introCtx.ellipse(0, 20, 20, 30, 0, 0, Math.PI * 2);
      introCtx.fill();
    }
    introCtx.restore();
  }
}

function renderPlayer() {
  ctx.save();
  ctx.translate(lx(lane), PLAYER_Y + (state === 'crashing' ? -15 : Math.sin(clock * 12) * 6));
  if (state === 'crashing') {
    ctx.rotate((crashT % 0.4 > 0.2 ? 1 : -1) * .3);
    const scale = Math.max(0, 1 - crashT);
    ctx.scale(scale, scale);
  }
  let isGrinning = false;
  if (state === 'play' && grinTimer > 0) isGrinning = true;
  if (state === 'crashing' && crashT < 1) isGrinning = true;
  
  const img = getActiveImage(isGrinning);
  if (img) {
    const s = 45;
    ctx.beginPath();
    ctx.arc(0, 0, s, 0, Math.PI * 2);
    ctx.clip();
    ctx.drawImage(img, -s, -s, s * 2, s * 2);
    ctx.lineWidth = 4;
    ctx.strokeStyle = isGrinning ? '#39ff88' : '#ffe600';
    ctx.stroke();
  } else {
    fbFace(ctx, 45);
    if (isGrinning) {
      ctx.fillStyle = '#222';
      ctx.beginPath();
      ctx.ellipse(0, 10, 15, 20, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.restore();
}

function drawHighStreet() {
  ctx.fillStyle = '#3a4a5a'; ctx.fillRect(0, 0, W, H);
  const bx = Math.sin(scrollY * 0.01) * 10;
  ctx.fillStyle = '#ff4d4d'; ctx.fillRect(20 + bx, scrollY % 300 - 100, 50, 80);
  ctx.fillStyle = '#ffd23f'; txt("CHIPPY", 45 + bx, scrollY % 300 - 80, 12, '#fff', 'center');
  ctx.fillStyle = '#f0b640'; ctx.fillRect(W - 70 + bx, (scrollY + 150) % 300 - 100, 50, 80);
  ctx.fillStyle = '#d8322c'; txt("LION", W - 45 + bx, (scrollY + 150) % 300 - 80, 12, '#fff', 'center');
}

function drawPavements() {
  ctx.fillStyle = '#7a8a9a';
  ctx.fillRect(0, 0, ROAD_LEFT, H); ctx.fillRect(ROAD_RIGHT, 0, W - ROAD_RIGHT, H);
  ctx.fillStyle = '#6a7a8a';
  for (let y = scrollY % 60 - 60; y < H; y += 60) {
    ctx.fillRect(0, y, ROAD_LEFT, 2); ctx.fillRect(ROAD_RIGHT, y, W - ROAD_RIGHT, 2);
  }
  ctx.fillStyle = '#3a4a5a'; ctx.fillRect(ROAD_LEFT - 4, 0, 4, H); ctx.fillRect(ROAD_RIGHT, 0, 4, H);
}

function drawRoad() {
  ctx.fillStyle = '#2a2e38'; ctx.fillRect(ROAD_LEFT, 0, ROAD_WIDTH, H);
  ctx.fillStyle = '#4a5060';
  for (let i = 1; i <= 2; i++) {
    for (let y = scrollY % 80 - 80; y < H; y += 80) ctx.fillRect(ROAD_LEFT + i * LANE_WIDTH - 2, y, 4, 40);
  }
}

function drawHUD() {
  rr(ctx, 10, 10, 160, 40, 8); ctx.fillStyle = 'rgba(10,12,20,.85)'; ctx.fill();
  txt(`Score: ${score}`, 20, 30, 20, '#fff', 'left');
  
  const bTxt = `Best: ${best}`;
  ctx.font = '900 16px "Arial Black",Impact,sans-serif';
  const bw = ctx.measureText(bTxt).width;
  rr(ctx, W - 20 - bw - 20, 10, bw + 30, 30, 8); ctx.fillStyle = 'rgba(10,12,20,.85)'; ctx.fill();
  txt(bTxt, W - 20 - bw - 5, 25, 16, '#cfd6e0', 'left');
  
  const tr = TIERS[tierOf(score)];
  rr(ctx, 10, 60, W - 20, 32, 8); ctx.fillStyle = 'rgba(10,12,20,.85)'; ctx.fill();
  txt(tr.n, W / 2, 76, 18, tr.c, 'center');
}

let lastT = performance.now();
function render(time) {
  requestAnimationFrame(render);
  const dt = Math.min((time - lastT) / 1000, 0.05); lastT = time;
  clock += dt;

  cv.width = W * window.devicePixelRatio; cv.height = H * window.devicePixelRatio;
  K = Math.min(stage.clientWidth / W, stage.clientHeight / H);
  cv.style.width = stage.clientWidth + 'px'; cv.style.height = stage.clientHeight + 'px';

  if (state === 'intro') {
    drawIntroAvatar(dt);
  }

  ctx.setTransform(K * window.devicePixelRatio, 0, 0, K * window.devicePixelRatio,
                   ((stage.clientWidth - W * K) / 2) * window.devicePixelRatio,
                   ((stage.clientHeight - H * K) / 2) * window.devicePixelRatio);
  
  ctx.save();
  drawHighStreet(); drawPavements(); drawRoad();

  if (state === 'menu' || state === 'intro') {
    scrollY = (scrollY + 120 * dt) % 640;
    ctx.restore();
    return;
  }

  if (state === 'play') {
    acc = Math.min(acc + dt * 250, 450);
    scrollY = (scrollY + acc * dt) % 640;
    const g = 180 - Math.min(score, 800) * 0.08;
    gap -= acc * dt; if (gap <= 0) { spawnRow(); gap = g; }
    
    lane += (target - lane) * (dt * 15);
    if (Math.abs(lane - target) < 0.05) lane = target;
    
    if (grinTimer > 0) grinTimer -= dt;
    
    const py = PLAYER_Y;
    const px = ROAD_LEFT + (lane + 0.5) * LANE_WIDTH;
    const pRad = 28;
    
    for (let i = objs.length - 1; i >= 0; i--) {
      const o = objs[i];
      o.y += acc * dt;
      if (o.y > H + 50) { objs.splice(i, 1); continue; }
      
      const ox = lx(o.l);
      const hit = Math.hypot(px - ox, py - o.y) < pRad + 25;
      
      if (hit) {
        if (o.t === 'm' || o.t === 'fork') { crash(o.t); break; }
        else { collect(o); objs.splice(i, 1); }
      }
    }
  }

  if (state === 'crashing') { crashT += dt; acc *= 0.9; scrollY = (scrollY + acc * dt) % 640; }

  objs.forEach(o => {
    ctx.save(); ctx.translate(lx(o.l), o.y);
    if (o.t === 'm' || o.t === 'fork') {
      const s = 1 + Math.sin(clock * 6 + o.id) * 0.08;
      ctx.scale(s, s); ctx.rotate(Math.sin(clock * 3 + o.id) * 0.1);
    } else {
      ctx.translate(0, Math.sin(clock * 5 + o.id) * 5);
      const rt = o.t === 'fish' ? Math.sin(clock * 2 + o.id) * 0.15 : 0;
      if (rt) ctx.rotate(rt);
    }
    ctx.drawImage(SP[o.t], -60, -60); ctx.restore();
  });

  renderPlayer();
  
  for (let i = stars.length - 1; i >= 0; i--) {
    let s = stars[i]; s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 200 * dt; s.life -= dt;
    if (s.life <= 0) { stars.splice(i, 1); continue; }
    ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.life * 10);
    ctx.globalAlpha = Math.max(0, s.life / s.maxLife);
    ctx.fillStyle = '#ffef5c'; ctx.beginPath();
    for (let j = 0; j < 5; j++) {
      ctx.lineTo(Math.cos((18 + j * 72) * Math.PI / 180) * s.size, -Math.sin((18 + j * 72) * Math.PI / 180) * s.size);
      ctx.lineTo(Math.cos((54 + j * 72) * Math.PI / 180) * (s.size / 2.5), -Math.sin((54 + j * 72) * Math.PI / 180) * (s.size / 2.5));
    }
    ctx.closePath(); ctx.fill(); ctx.restore();
  }

  for (let i = fx.length - 1; i >= 0; i--) {
    const f = fx[i]; f.t += dt; f.y -= 40 * dt;
    if (f.t > f.life) { fx.splice(i, 1); continue; }
    ctx.globalAlpha = 1 - (f.t / f.life); txt(f.txt, f.x, f.y, 28, '#39ff88', 'center');
    ctx.globalAlpha = 1;
  }

  if (cap) {
    cap.t += dt; const maxL = cap.life || 4;
    if (cap.t > maxL) cap = null;
    else {
      ctx.save(); ctx.globalAlpha = Math.min(1, maxL - cap.t);
      const padding = 16, cw = W - 40;
      ctx.font = '900 18px "Arial Black",Impact,sans-serif';
      const words = cap.s.split(' '), lines = []; let cur = words[0];
      for (let i = 1; i < words.length; i++) {
        if (ctx.measureText(cur + " " + words[i]).width < cw - padding * 2) cur += " " + words[i];
        else { lines.push(cur); cur = words[i]; }
      }
      lines.push(cur);
      const ch = lines.length * 24 + padding * 2;
      const cy = Math.max(100, PLAYER_Y - 140 - (state === 'crashing' ? 50 : 0));
      
      rr(ctx, 20, cy, cw, ch, 12); ctx.fillStyle = '#fff'; ctx.fill();
      ctx.lineWidth = 4; ctx.strokeStyle = '#222'; ctx.stroke();
      
      ctx.beginPath(); ctx.moveTo(20 + cw / 2 - 10, cy + ch); ctx.lineTo(20 + cw / 2 + 10, cy + ch);
      ctx.lineTo(20 + cw / 2, cy + ch + 15); ctx.closePath(); ctx.fill(); ctx.stroke();
      
      lines.forEach((l, i) => txt(l, W / 2, cy + padding + 12 + i * 24, 18, '#222', 'center'));
      ctx.restore();
    }
  }

  drawHUD();
  ctx.restore();
}

function handleInput(e) {
  if (state !== 'play') return;
  const t = e.type.includes('touch') ? e.touches[0] : e;
  const cr = cv.getBoundingClientRect();
  const tx = (t.clientX - cr.left) / K, ty = (t.clientY - cr.top) / K;
  if (tx < ROAD_LEFT || tx > ROAD_RIGHT || ty < 100) return;
  const l = Math.floor((tx - ROAD_LEFT) / LANE_WIDTH);
  if (l >= 0 && l <= 2) target = l;
}

cv.addEventListener('mousedown', handleInput);
cv.addEventListener('touchstart', handleInput, { passive: true });
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') move(-1);
  if (e.key === 'ArrowRight' || e.key === 'd') move(1);
});

$('startBtn').onclick = () => {
  $('menu').classList.remove('show');$('introOverlay').classList.add('show');
  state = 'intro';
  
  initAudio();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  
  garyAudio.currentTime = 0;
  garyAudio.play().catch(e => {
    console.warn("Audio play blocked", e);
    startGame();
  });
};

garyAudio.onended = () => {
  $('introOverlay').classList.remove('show');
  startGame();
};

function startGame() {
  reset();
  state = 'play';
}

$('againBtn').onclick = () => {$('over').classList.remove('show');
  reset(); state = 'play';
};

requestAnimationFrame(render);
})();
</script>
</body>
