<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2f353f">
<title>Gary Eats: The Runner</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
:root{--w:min(100vw,calc(100vh*9/16))}
@supports(height:100dvh){:root{--w:min(100vw,calc(100dvh*9/16))}}
html,body{height:100%;background:#2f353f;overflow:hidden;touch-action:none}
body{display:flex;align-items:center;justify-content:center;font-family:'Arial Black',Impact,'Segoe UI',sans-serif;color:#fff}
#stage{--u:3.6px;position:relative;width:var(--w);height:calc(var(--w)*16/9);background:#111;overflow:hidden;box-shadow:0 0 0 1px #0006,0 0 70px #000a}
canvas{display:block;width:100%;height:100%;touch-action:none}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*3.5);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .5s ease,transform .5s ease,visibility 0s .5s}
.screen.show{opacity:1;visibility:visible;pointer-events:auto;transform:none;transition:opacity .5s ease,transform .5s ease,visibility 0s}
#menu{transform:scale(1.5);background:radial-gradient(ellipse at 50% 45%,rgba(10,12,24,.3),rgba(10,12,24,.82))}
#over{transform:scale(.92);background:rgba(8,10,20,.74);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);padding:0 calc(var(--u)*6)}
h1{text-align:center;font-size:calc(var(--u)*10.4);line-height:1.02;color:#fff36b;-webkit-text-stroke:calc(var(--u)*.45) #4a1200;paint-order:stroke fill;text-shadow:0 calc(var(--u)*.9) 0 #d3390b,0 0 calc(var(--u)*5) rgba(255,214,0,.75)}
h1 span{display:block}
h1 span+span{color:#ff6a3d}
#faceWrap{width:calc(var(--u)*46);height:calc(var(--u)*46);display:flex;align-items:center;justify-content:center;animation:bob 2.4s ease-in-out infinite;filter:drop-shadow(0 calc(var(--u)*1.5) calc(var(--u)*2) rgba(0,0,0,.6))}
#menuFace{max-width:100%;max-height:100%;object-fit:contain}
#menuFb{display:none;font-size:calc(var(--u)*32);align-items:center;justify-content:center}
@keyframes bob{0%,100%{transform:rotate(-9deg) scale(.93)}50%{transform:rotate(9deg) scale(1.09)}}
.arcade{font:inherit;font-size:calc(var(--u)*6.2);line-height:1.1;width:calc(var(--u)*84);padding:calc(var(--u)*3.6) calc(var(--u)*4);border:calc(var(--u)*.7) solid #fff;border-radius:calc(var(--u)*4.5);background:#eaff00;color:#1b1b1b;text-transform:uppercase;cursor:pointer;box-shadow:0 calc(var(--u)*1.6) 0 #8a9a00,0 0 calc(var(--u)*5) #eaff00;animation:pulse 1.1s ease-in-out infinite;transition:transform .08s}
.arcade:active{transform:translateY(calc(var(--u)*1.2));box-shadow:0 calc(var(--u)*.4) 0 #8a9a00,0 0 calc(var(--u)*3) #eaff00}
.arcade:focus-visible{outline:calc(var(--u)*.8) solid #fff;outline-offset:calc(var(--u)*.8)}
@keyframes pulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.18)}}
.hint{font:600 calc(var(--u)*3.3)/1.3 'Segoe UI',Arial,sans-serif;color:#cfd6e0;text-align:center;width:calc(var(--u)*80)}
h2{text-align:center;font-size:calc(var(--u)*15);line-height:1;color:#ff5a36;-webkit-text-stroke:calc(var(--u)*.5) #3a0a00;paint-order:stroke fill;text-shadow:0 calc(var(--u)*1) 0 #7c1d05}
h2 span{display:block;font-size:calc(var(--u)*8.5);color:#fff;margin-top:calc(var(--u)*1.5);-webkit-text-stroke:0;text-shadow:0 calc(var(--u)*.6) 0 #000a}
.stat{font-size:calc(var(--u)*5.2);text-align:center;line-height:1.25}
.stat small{display:block;font:700 calc(var(--u)*3.4) 'Segoe UI',Arial,sans-serif;color:#aab3c2}
.stat b{color:#ffe600;font-size:calc(var(--u)*11);display:block}
#fTier{font-size:calc(var(--u)*5.4);color:#39ff88;font-weight:bold;text-align:center;display:block;margin-top:calc(var(--u)*1)}
#promo{width:100%;border:calc(var(--u)*.6) dashed #ffe600;background:rgba(255,230,0,.13);border-radius:calc(var(--u)*3);padding:calc(var(--u)*3);font:700 calc(var(--u)*4.2)/1.35 'Segoe UI',Arial,sans-serif;text-align:center}
#promo b{color:#ffe600;font-family:'Arial Black',Impact,sans-serif}
@media(prefers-reduced-motion:reduce){#faceWrap,.arcade{animation:none}.screen{transition:none}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <!-- Hidden, but NOT display:none, so browsers still decode frames -->
  <img id="grinVid" src="GaryRoast.webp" style="position:absolute;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none">


  <div id="menu" class="screen show">
    <h1><span>GARY EATS:</span> <span>THE RUNNER</span></h1>
    <div id="faceWrap"><img id="menuFace" alt="Gary"><div id="menuFb">&#128523;</div></div>
    <button id="startBtn" class="arcade">LET'S GIVE IT A GO!</button>
    <p class="hint">Tap the left or right half of the screen, or use A / D or the arrow keys, to change lane.</p>
  </div>

  <div id="over" class="screen">
    <h2>STUFFED! <span>Game Over</span></h2>
    <div class="stat"><small>Final score</small><b id="fScore">0</b></div>
    <div class="stat"><small>Highest rating reached</small><span id="fTier"></span></div>
    <div id="promo">Use code <b>GARYEATS10</b> for 10% off your next takeaway!</div>
    <button id="againBtn" class="arcade">PLAY AGAIN</button>
  </div>
</div>

<script>
(()=>{
'use strict';
const W=360, H=640, CX=180;
const ROAD_LEFT=75, ROAD_RIGHT=285, ROAD_WIDTH=210;
const LANE_WIDTH = ROAD_WIDTH / 3;
const PLAYER_Y = 540;

const TIERS = [
  { n: 'Absolute Rubbish', c: '#ff4d4d' },
  { n: 'Bit Dry, Needs Salt', c: '#ffb02e' },
  { n: 'Proper Decent Food', c: '#39ff88' },
  { n: 'BEAUTIFUL!', c: '#00ffff' },
  { n: "I'll have to bring Danny here one day", c: '#ffe600' }
];

const FOODS = { kebab: 5, fish: 10, roast: 25 };
const CAPS = [
  "Look at the absolute size of that portion, fellas! Phrwoar.",
  "The crackling is elite.",
  "Swimming in proper thick gravy. Get a load of that.",
  "That is an absolute unit of a pie."
];

const IMG = window.GARY_IMG || '';

const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv ? cv.getContext('2d') : null, stage = $('stage');
const grinVid = $('grinVid'); // If null, we'll handle it safely below

let K = 1, state = 'menu', score = 0, best = 0, tierMax = 0, lane = 1, target = 1, scrollY = 0, acc = 0, gap = 160;
let objs = [], fx = [], cap = null, mile = 0, crashT = 0, clock = 0, uid = 0;
let grinTimer = 0, stars = [];
let lastTierIndex = 0;

try { best = +localStorage.getItem('garyBest') || 0; } catch(e){}

function tierOf(s) {
  if (s <= 50) return 0;
  if (s <= 150) return 1;
  if (s <= 300) return 2;
  if (s <= 500) return 3;
  return 4;
}

function lx(l) { return ROAD_LEFT + (l + 0.5) * LANE_WIDTH; }


/* ---------- Image cache & offscreen bitmap ---------- */
let spr = null, ar = 1;
const face = new Image();
face.onload = () => {
  if (!face.naturalWidth) return;
  ar = face.naturalWidth / face.naturalHeight;
  const h = Math.min(256, face.naturalHeight);
  spr = document.createElement('canvas');
  spr.height = h; spr.width = Math.round(h * ar);
  const c = spr.getContext('2d');
  c.imageSmoothingQuality = 'high';
  c.drawImage(face, 0, 0, spr.width, spr.height);
};
const noImg = () => { $('menuFace').style.display = 'none'; $('menuFb').style.display = 'flex'; };
face.onerror = noImg;
$('menuFace').onerror = noImg;
if (IMG) { face.src = IMG; $('menuFace').src = IMG; } else noImg();

/* ---------- Vector Sprites ---------- */
function mk(fn) {
  const s = document.createElement('canvas');
  s.width = s.height = 120;
  const c = s.getContext('2d');
  c.translate(60, 60);
  c.lineJoin = 'round'; c.lineCap = 'round';
  fn(c);
  return s;
}

function dMush(c) {
  // Takeaway brown button mushroom
  c.lineWidth = 3; c.strokeStyle = '#2b1810';
  c.fillStyle = '#f5eedc'; // Thick off-white stalk
  c.beginPath();
  c.moveTo(-12, 5); c.lineTo(-10, 38); c.lineTo(10, 38); c.lineTo(12, 5);
  c.closePath(); c.fill(); c.stroke();
  c.fillStyle = '#8a5a36'; // Light brown cap
  c.beginPath();
  c.arc(0, 5, 32, Math.PI, 0);
  c.closePath(); c.fill(); c.stroke();
}

function dFork(c) {
  // Cheap plastic fork hazard
  c.lineWidth = 3; c.strokeStyle = '#a0b0c0'; c.fillStyle = '#e8f2fc';
  c.beginPath();
  c.fillRect(-6, -10, 12, 48);
  c.strokeRect(-6, -10, 12, 48);
  [-14, -6, 2, 10].forEach(x => {
    c.fillRect(x, -42, 4, 34);
    c.strokeRect(x, -42, 4, 34);
  });
  c.fillRect(-16, -12, 32, 8);
  c.strokeRect(-16, -12, 32, 8);
}

function dKebab(c) {
  c.lineWidth = 3; c.strokeStyle = '#4a2a10';
  c.fillStyle = '#5aa832';
  [[-18, -6], [0, -12], [18, -6]].forEach(([x, y]) => { c.beginPath(); c.ellipse(x, y, 12, 8, 0, 0, 7); c.fill(); c.stroke(); });
  c.fillStyle = '#8a4b22';
  [[-10, -14], [6, -16], [-2, -6], [12, -8]].forEach(([x, y]) => { c.beginPath(); c.ellipse(x, y, 11, 6, 0, 0, 7); c.fill(); c.stroke(); });
  c.fillStyle = '#d8322c';
  [[-16, -12], [16, -14]].forEach(([x, y]) => { c.beginPath(); c.ellipse(x, y, 6, 4, 0, 0, 7); c.fill(); c.stroke(); });
  c.fillStyle = '#f2cf8c';
  c.beginPath(); c.ellipse(0, 4, 28, 24, 0, 0, Math.PI); c.closePath(); c.fill(); c.stroke();
  c.strokeStyle = '#fff'; c.lineWidth = 3;
  c.beginPath(); c.moveTo(-18, -12); c.quadraticCurveTo(-6, -2, 3, -14); c.quadraticCurveTo(11, -6, 20, -10); c.stroke();
}

function dFish(c) {
  c.lineWidth = 3; c.strokeStyle = '#4a3208'; c.fillStyle = '#ffd23f';
  [[-18, -3, -.3], [-8, -6, -.1], [2, -8, .05], [12, -6, .2], [22, -3, .4]].forEach(([x, y, a]) => {
    c.save(); c.translate(x, y); c.rotate(a); c.fillRect(-3.5, -22, 7, 26); c.strokeRect(-3.5, -22, 7, 26); c.restore();
  });
  c.save(); c.translate(-2, -6); c.rotate(-.45); c.fillStyle = '#e9a23b';
  c.beginPath(); c.ellipse(0, 0, 24, 10, 0, 0, 7); c.fill(); c.stroke();
  c.beginPath(); c.moveTo(22, 0); c.lineTo(32, -8); c.lineTo(32, 8); c.closePath(); c.fill(); c.stroke();
  c.restore();
  c.fillStyle = '#fff'; c.beginPath(); c.moveTo(-26, 3); c.lineTo(26, 3); c.lineTo(20, 32); c.lineTo(-20, 32); c.closePath(); c.fill();
  c.fillStyle = '#1f5fbf';
  [-20, -8, 4, 16].forEach(x => { c.beginPath(); c.moveTo(x, 3); c.lineTo(x + 6, 3); c.lineTo((x + 6) * .79, 32); c.lineTo(x * .79, 32); c.closePath(); c.fill(); });
  c.beginPath(); c.moveTo(-26, 3); c.lineTo(26, 3); c.lineTo(20, 32); c.lineTo(-20, 32); c.closePath(); c.stroke();
}

function dRoast(c) {
  c.lineWidth = 3; c.strokeStyle = '#3a2a10';
  c.fillStyle = '#fff'; c.beginPath(); c.ellipse(0, 12, 38, 20, 0, 0, 7); c.fill(); c.stroke();
  c.fillStyle = '#e6edf4'; c.beginPath(); c.ellipse(0, 12, 28, 15, 0, 0, 7); c.fill();
  c.fillStyle = '#7a4318'; c.beginPath(); c.ellipse(3, 14, 21, 9, 0, 0, 7); c.fill();
  c.fillStyle = '#f0b640'; [[-24, 8], [-18, 16]].forEach(([x, y]) => { c.beginPath(); c.ellipse(x, y, 8, 5, .3, 0, 7); c.fill(); c.stroke(); });
  c.fillStyle = '#b4573f'; [[-8, 5, -.3], [3, 3, .1]].forEach(([x, y, a]) => { c.save(); c.translate(x, y); c.rotate(a); c.beginPath(); c.ellipse(0, 0, 13, 7, 0, 0, 7); c.fill(); c.stroke(); c.restore(); });
  c.fillStyle = '#e9b04f'; c.beginPath(); c.moveTo(12, 8); c.lineTo(15, -10); c.quadraticCurveTo(22, -18, 29, -10); c.lineTo(32, 8); c.quadraticCurveTo(22, 14, 12, 8); c.closePath(); c.fill(); c.stroke();
  c.fillStyle = '#4caf3a'; [[-5, 20], [2, 23], [-11, 23], [6, 18]].forEach(([x, y]) => { c.beginPath(); c.arc(x, y, 3, 0, 7); c.fill(); });
}

const SP = { m: mk(dMush), fork: mk(dFork), kebab: mk(dKebab), fish: mk(dFish), roast: mk(dRoast) };

/* ---------- Helpers ---------- */
function rr(c, x, y, w, h, r) {
  c.beginPath(); c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

function txt(s, x, y, size, col, al) {
  ctx.font = '900 ' + size + 'px "Arial Black",Impact,sans-serif';
  ctx.textAlign = al; ctx.textBaseline = 'middle';
  ctx.lineWidth = 4; ctx.lineJoin = 'round'; ctx.strokeStyle = 'rgba(0,0,0,.85)';
  ctx.strokeText(s, x, y); ctx.fillStyle = col; ctx.fillText(s, x, y);
}

function fbFace(c, r) {
  c.fillStyle = '#ffd166'; c.strokeStyle = '#4a2a10'; c.lineWidth = 4;
  c.beginPath(); c.arc(0, -r, r, 0, 7); c.fill(); c.stroke();
  c.fillStyle = '#222'; c.beginPath(); c.arc(-r * .35, -r * 1.15, r * .1, 0, 7); c.arc(r * .35, -r * 1.15, r * .1, 0, 7); c.fill();
  c.beginPath(); c.arc(0, -r * .85, r * .5, .15 * Math.PI, .85 * Math.PI); c.stroke();
}

/* ---------- Grin video ---------- */
// When the clip ends, rewind it straight away so the next grin can start instantly.


function triggerGrin() {
  grinTimer = 1.3; // Matches the animation duration

  // Optional: Uncomment the line below if you want the WebP to restart from frame 1 every time it triggers
  // grinVid.src = grinVid.src;

  const px = lx(lane);
  for (let i = 0; i < 20; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 40 + Math.random() * 90;
    const side = Math.random() < 0.5 ? -30 : 30;
    stars.push({
      x: px + side, y: PLAYER_Y - 35,
      vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
      life: 0.6 + Math.random() * 0.5, maxLife: 1.1,
      size: 4 + Math.random() * 5
    });
  }
}


/* ---------- Game Flow ---------- */
function reset() {
  score = 0; tierMax = 0; lastTierIndex = 0; lane = target = 1; scrollY = 0; acc = 0; gap = 160;
  objs = []; fx = []; cap = null; mile = 0; crashT = 0; grinTimer = 0; stars = [];
}

function move(d) {
  if (state === 'play') target = Math.max(0, Math.min(2, target + d));
}

function spawnRow() {
  const L = [0, 1, 2].sort(() => Math.random() - .5);
  let i = 0;
  const add = (l, t) => objs.push({ t, l, y: -60, id: uid++ });
  const food = () => { const r = Math.random(); return r < .45 ? 'kebab' : r < .8 ? 'fish' : 'roast'; };
  const hazardType = () => Math.random() < 0.5 ? 'm' : 'fork';

  const hasH = Math.random() < .55;
  if (hasH) add(L[i++], hazardType());
  const nf = hasH ? (Math.random() < .6 ? 1 : 0) : (Math.random() < .5 ? 1 : 2);
  for (let k = 0; k < nf; k++) add(L[i++], food());
}

function collect(o) {
  const pts = FOODS[o.t];
  score += pts;
  fx.push({ x: lx(o.l), y: o.y, t: 0, life: .85, txt: '+' + pts });

  // Roast dinners and tier-ups both grin, but only trigger once per pickup
  const currentTier = tierOf(score);
  let grin = o.t === 'roast';
  if (currentTier > lastTierIndex) { lastTierIndex = currentTier; grin = true; }
  if (grin) triggerGrin();
  tierMax = Math.max(tierMax, currentTier);

  if (score >= (mile + 1) * 40) {
    mile = Math.floor(score / 40);
    cap = { s: CAPS[Math.floor(Math.random() * CAPS.length)], t: 0 };
  }
}

function crash(hitType) {
  crashT = 0;
  cap = null;
  state = 'crash_' + hitType;
}

function endGame() {
  state = 'over';
  if (score > best) {
    best = score;
    try { localStorage.setItem('garyBest', best); } catch (e) {}
  }

  try {
    $('fScore').textContent = score;
    const T = TIERS[tierMax] || TIERS[TIERS.length - 1];
    $('fTier').textContent = 'Tier: ' + T.n;
    $('fTier').style.color = T.c;
    $('over').classList.add('show');
  } catch (e) {
    console.warn('UI update failed, but saving loop:', e);
  }
}

function update(dt) {
  clock += dt;
  lane += (target - lane) * Math.min(1, dt * 16);

  if (grinTimer > 0) grinTimer = Math.max(0, grinTimer - dt);

  for (let i = stars.length - 1; i >= 0; i--) {
    const s = stars[i];
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    s.life -= dt;
    if (s.life <= 0) stars.splice(i, 1);
  }

  if (cap) {
    cap.t += dt;
    if (cap.t > 2.2) cap = null;
  }

  for (const f of fx) f.t += dt;
  fx = fx.filter(f => f.t < f.life);

  const speed = 260 + Math.floor(score / 50) * 20;

  if (state === 'menu') {
    scrollY = (scrollY + 120 * dt) % 640;
    return;
  }

  if (state.startsWith('crash')) {
    crashT += dt;
    if (crashT > 2.0) endGame();
    return;
  }

  if (state !== 'play') return;

  scrollY = (scrollY + speed * dt) % 640;
  acc += speed * dt;
  if (acc >= gap) {
    acc -= gap;
    gap = 140 + Math.random() * 80;
    spawnRow();
  }

  for (const o of objs) {
    o.y += speed * dt;
    if (!o.d && Math.abs(o.y - PLAYER_Y) < 36 && Math.abs(lane - o.l) < .55) {
      o.d = 1;
      if (o.t === 'm' || o.t === 'fork') {
        crash(o.t);
        return;
      }
      collect(o);
    }
  }
  objs = objs.filter(o => !o.d && o.y < H + 60);
}

/* ---------- Rendering Engine ---------- */
function drawHighStreet() {
  ctx.fillStyle = '#222';
  ctx.fillRect(0, 0, W, H);

  const totalH = 640;
  const offY = scrollY % totalH;

  const drawSide = (isRight) => {
    const xBase = isRight ? ROAD_RIGHT : 0;
    const w = 75;

    for (let pass = -1; pass <= 1; pass++) {
      const py = pass * totalH + offY;

      // Building 1: Chippy
      ctx.fillStyle = '#8b3a2b'; ctx.fillRect(xBase, py - 640, w, 200);
      ctx.fillStyle = '#2b1d14'; ctx.fillRect(xBase + 8, py - 580, w - 16, 50);
      ctx.fillStyle = '#fceabb'; ctx.fillRect(xBase + 12, py - 576, w - 24, 42);
      ctx.fillStyle = '#e82525'; ctx.fillRect(xBase + 4, py - 610, w - 8, 20);
      ctx.fillStyle = '#fff'; ctx.font = '900 10px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('CHIPPY', xBase + w / 2, py - 600);

      // Building 2: Bakers
      ctx.fillStyle = '#5c4033'; ctx.fillRect(xBase, py - 440, w, 220);
      ctx.fillStyle = '#1c2833'; ctx.fillRect(xBase + 8, py - 380, w - 16, 60);
      ctx.fillStyle = '#fff8dc'; ctx.fillRect(xBase + 12, py - 376, w - 24, 52);
      ctx.fillStyle = '#28b463'; ctx.fillRect(xBase + 4, py - 415, w - 8, 20);
      ctx.fillStyle = '#fff'; ctx.fillText('BAKERS', xBase + w / 2, py - 405);

      // Building 3: Red Lion Pub
      ctx.fillStyle = '#34495e'; ctx.fillRect(xBase, py - 220, w, 220);
      ctx.fillStyle = '#1a252f'; ctx.fillRect(xBase + 8, py - 160, w - 16, 60);
      ctx.fillStyle = '#f9e79f'; ctx.fillRect(xBase + 12, py - 156, w - 24, 52);
      ctx.fillStyle = '#900c3f'; ctx.fillRect(xBase + 4, py - 195, w - 8, 22);
      ctx.fillStyle = '#ffe600'; ctx.fillText('THE RED LION', xBase + w / 2, py - 184);
    }
  };

  drawSide(false);
  drawSide(true);
}

function drawPavements() {
  const pWidth = 15;
  const bh = 20;
  const offY = scrollY % bh;

  for (let side = 0; side < 2; side++) {
    const x = side === 0 ? ROAD_LEFT - pWidth : ROAD_RIGHT;
    ctx.fillStyle = '#7f8c8d';
    ctx.fillRect(x, 0, pWidth, H);

    ctx.strokeStyle = '#2c3e50';
    ctx.lineWidth = 2;
    for (let y = -bh + offY; y < H + bh; y += bh) {
      ctx.strokeRect(x, y, pWidth, bh);
    }
  }
}

function drawRoad() {
  ctx.fillStyle = '#3a3f47';
  ctx.fillRect(ROAD_LEFT, 0, ROAD_WIDTH, H);

  const dashH = 35, gapH = 25;
  const totalD = dashH + gapH;
  const offY = scrollY % totalD;

  ctx.fillStyle = '#ffffff';
  for (let l = 1; l <= 2; l++) {
    const lineX = ROAD_LEFT + l * LANE_WIDTH - 3;
    for (let y = -totalD + offY; y < H + totalD; y += totalD) {
      ctx.fillRect(lineX, y, 6, dashH);
    }
  }
}

function drawObj(o) {
  const x = lx(o.l), y = o.y;
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(x, y + 20, 22, 7, 0, 0, 7); ctx.fill();
  const bob = Math.sin(clock * 6 + o.id) * 3;
  ctx.drawImage(SP[o.t], x - 35, y - 35 + bob, 70, 70);
}

function drawPlayer() {
  const px = lx(lane), py = PLAYER_Y;

  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath(); ctx.ellipse(px, py + 22, 32, 9, 0, 0, 7); ctx.fill();

  ctx.save();
  ctx.translate(px, py);

  let w = 80, h = 80;
  if (spr) { w = h * ar; if (w > 80) { w = 80; h = w / ar; } }

 // Only draw the animation if it is grinning AND has loaded fully
// Add 'grinVid &&' right at the start to protect against null elements
const isGrinning = grinTimer > 0 && grinVid && grinVid.complete && grinVid.naturalWidth > 0;

if (isGrinning) {
  ctx.drawImage(grinVid, -w / 2, -h / 2, w, h);
} else if (spr) {
  ctx.drawImage(spr, -w / 2, -h / 2, w, h);
} else {
  fbFace(ctx, 40);
}



  ctx.restore();

  // Star particles
  for (const s of stars) {
    const p = s.life / s.maxLife;
    ctx.save();
    ctx.fillStyle = Math.floor(clock * 20) % 2 ? '#ffe600' : '#ffffff';
    ctx.globalAlpha = Math.max(0, p);
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size * p, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function drawHud() {
  const T = TIERS[tierOf(score)];

  ctx.fillStyle = 'rgba(10,12,20,.85)';
  rr(ctx, 10, 10, 340, 38, 10); ctx.fill();
  ctx.strokeStyle = T.c; ctx.lineWidth = 3; ctx.stroke();

  txt('Tier: ' + T.n, CX, 29, 13, T.c, 'center');
  txt('SCORE ' + score, 20, 70, 18, '#fff', 'left');
  txt('BEST ' + best, 340, 70, 13, '#cfd6e0', 'right');
}

function drawCap() {
  if (!cap) return;
  const t = cap.t, a = t > 1.8 ? 1 - (t - 1.8) / .4 : 1;
  ctx.save(); ctx.globalAlpha = Math.max(0, a);
  ctx.translate(CX, 240 + Math.sin(t * 6) * 3);
  ctx.font = '900 18px "Arial Black",sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  const fit = Math.min(1, 310 / ctx.measureText(cap.s).width);
  ctx.scale(fit, fit);

  ctx.lineJoin = 'round'; ctx.lineWidth = 7; ctx.strokeStyle = '#1b0326';
  ctx.strokeText(cap.s, 0, 0);
  ctx.fillStyle = '#ffe600'; ctx.fillText(cap.s, 0, 0);
  ctx.restore();
}

function drawBubble() {
  const s = Math.min(1, crashT * 6), px = lx(lane), bx = Math.max(115, Math.min(245, px)), by = 380, bw = 240, bh = 110;
  ctx.save(); ctx.translate(bx, by); ctx.scale(s, s);

  const tx = Math.max(-80, Math.min(80, px - bx)), ty = PLAYER_Y - 60 - by;
  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#111'; ctx.lineWidth = 4; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(-14, bh / 2 - 2); ctx.lineTo(tx, ty); ctx.lineTo(14, bh / 2 - 2); ctx.closePath(); ctx.fill(); ctx.stroke();
  rr(ctx, -bw / 2, -bh / 2, bw, bh, 20); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.fillRect(-12, bh / 2 - 4, 24, 7);

  ctx.fillStyle = '#111'; ctx.font = '900 15px "Arial Black",sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  if (state === 'crash_fork') {
    ctx.fillText("You can't tackle a", 0, -22);
    ctx.fillText("premium dinner with a plastic", 0, 0);
    ctx.fillText("fork! Unprofessional!", 0, 22);
  } else {
    ctx.fillText("Right, that's", 0, -18);
    ctx.fillText("absolutely", 0, 4);
    ctx.fillText("ruined it!", 0, 26);
  }
  ctx.restore();
}

function render() {
  ctx.setTransform(K, 0, 0, K, 0, 0);
  ctx.save();

  drawHighStreet();
  drawPavements();
  drawRoad();

  if (state !== 'menu') {
    for (let i = objs.length - 1; i >= 0; i--) drawObj(objs[i]);
    drawPlayer();

    for (const f of fx) {
      const k = f.t / f.life; ctx.save(); ctx.globalAlpha = 1 - k;
      ctx.strokeStyle = '#ffe600'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(f.x, f.y, 10 + k * 30, 0, 7); ctx.stroke();
      ctx.restore(); ctx.save(); ctx.globalAlpha = 1 - k * k; txt(f.txt, f.x, f.y - k * 30, 22, '#ffe600', 'center'); ctx.restore();
    }
  }

  ctx.restore();

  if (state !== 'menu') {
    drawHud(); drawCap();
    if (state.startsWith('crash') || state === 'over') {
      if (state.startsWith('crash')) {
        ctx.fillStyle = 'rgba(255,40,40,' + Math.max(0, .45 - crashT) + ')';
        ctx.fillRect(0, 0, W, H);
      }
      drawBubble();
    }
  }
}

/* ---------- Input & Engine Mechanics ---------- */
addEventListener('keydown', e => {
  if (e.repeat) return;
  const k = e.key.toLowerCase();
  if (k === 'arrowleft' || k === 'a') move(-1);
  else if (k === 'arrowright' || k === 'd') move(1);
  else return;
  if (state === 'play') e.preventDefault();
});

cv.addEventListener('pointerdown', e => {
  if (state !== 'play') return;
  const r = cv.getBoundingClientRect();
  move(e.clientX - r.left < r.width / 2 ? -1 : 1);
  e.preventDefault();
});

$('startBtn').addEventListener('click', e => {
  e.currentTarget.blur(); 
  reset(); 
  state = 'play'; 
  $('menu').classList.remove('show');
  
  // Animated WebP images play automatically, so we removed the video unlock line!
});

});

$('againBtn').addEventListener('click', e => {
  e.currentTarget.blur(); $('over').classList.remove('show'); reset(); state = 'menu'; $('menu').classList.add('show');
});

function resize() {
  const w = stage.clientWidth, dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  cv.width = Math.round(w * dpr); cv.height = Math.round(w * 16 / 9 * dpr); K = cv.width / W;
  stage.style.setProperty('--u', w / 100 + 'px');
  ctx.imageSmoothingQuality = 'high';
}

let last = performance.now();
function loop(ts) {
  const dt = Math.max(0, Math.min(.05, (ts - last) / 1000)); last = ts;
  update(dt); 
  render();
  
  // Updated debug line for an image element instead of a video
  if (/debug/.test(location.search)) {
    txt('img complete:' + grinVid.complete, CX, 610, 11, '#0f0', 'center');
  }
  
  requestAnimationFrame(loop);
}


}

addEventListener('resize', resize);
resize(); requestAnimationFrame(loop);
})();
</script>
