<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Gary Eats! — Professional Edition</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    body {
      margin: 0; padding: 0; background: #0a0c14; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex; justify-content: center; align-items: center;
      height: 100vh; height: 100dvh; overflow: hidden;
    }
    #stage {
      position: relative; width: 100%; max-width: 420px; height: 100%; max-height: 850px;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      background: #111; box-shadow: 0 12px 40px rgba(0,0,0,0.7); overflow: hidden;
    }
    canvas {
      display: block; width: 100%; height: auto; touch-action: none; background: #1a1e24;
    }
    .overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(10, 12, 20, 0.95); display: flex; flex-direction: column;
      justify-content: center; align-items: center; opacity: 0; pointer-events: none;
      transition: opacity 0.5s ease-in-out; z-index: 10; padding: 30px; text-align: center;
    }
    .overlay.show { opacity: 1; pointer-events: auto; }
    h1 { font-size: 2.2rem; margin: 0 0 12px 0; color: #ffe600; text-transform: uppercase; font-weight: 900; letter-spacing: -0.5px; }
    p { font-size: 1rem; margin: 0 0 25px 0; color: #cfd6e0; line-height: 1.4; }
    button {
      background: #ffe600; color: #111; border: none; padding: 16px 42px;
      font-size: 1.05rem; font-weight: 900; border-radius: 32px; cursor: pointer;
      text-transform: uppercase; box-shadow: 0 6px 24px rgba(255,230,0,0.35);
      transition: transform 0.1s ease, background 0.2s ease;
    }
    button:active { transform: scale(0.96); background: #e5ce00; }
    
    #introOverlay { background: rgba(8, 10, 16, 0.98); }
    .sub-btn {
      background: transparent; color: #8a99ad; border: 2px solid #333c4d; padding: 12px 30px;
      font-size: 0.85rem; margin-top: 16px; box-shadow: none; border-radius: 24px; cursor: pointer;
    }
    .sub-btn:active { background: #1a2230; color: #fff; }
    .profile-img { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; border: 4px solid #ffe600; margin-bottom: 16px; box-shadow: 0 6px 20px rgba(0,0,0,0.5); }
    
    #introAvatar {
      width: 180px; height: 180px; margin-bottom: 24px; border-radius: 50%;
    }
  </style>
</head>
<body>

  <div id="stage">
    <canvas id="c"></canvas>
    
    <!-- Audio source -->
    <audio id="garyAudio" src="gary_audio.mp3" preload="auto"></audio>

    <!-- Main Menu -->
    <div id="menu" class="overlay show">
      <img class="profile-img" src="gary_closed.png.PNG" alt="Gary" onerror="this.src='gary_open.png.PNG'">
      <h1>Gary Eats!</h1>
      <p>Navigate the high street, dodge hazards, and collect proper decent grub.</p>
      <button id="startBtn">Play Game</button>
    </div>

    <!-- Audio Intro Screen -->
    <div id="introOverlay" class="overlay">
      <canvas id="introAvatar" width="180" height="180"></canvas>
      <p id="introCaption" style="font-weight: 700; color: #ffe600; font-size: 1.1rem; margin-bottom: 15px;">"Right, let's get some proper decent grub!"</p>
      <button id="skipIntroBtn" class="sub-btn">Skip</button>
    </div>

    <!-- Game Over Overlay -->
    <div id="over" class="overlay">
      <h1>Proper Ruined!</h1>
      <p id="fScore">Score: 0</p>
      <p id="fTier">Tier: Absolute Rubbish</p>
      <button id="againBtn">Try Again</button>
    </div>
  </div>

<script>
(() => {
'use strict';
const W = 360, H = 640, CX = 180;
const ROAD_WIDTH = 189; // Reduced by 10% from 210
const ROAD_LEFT = (W - ROAD_WIDTH) / 2; // 85.5px
const ROAD_RIGHT = ROAD_LEFT + ROAD_WIDTH; // 274.5px
const LANE_WIDTH = ROAD_WIDTH / 3; // 63px
const PLAYER_Y = 540;

const TIERS = [
  { n: 'Absolute Rubbish', c: '#ff4d4d' },
  { n: 'Bit Dry, Needs Salt', c: '#ffb02e' },
  { n: 'Proper Decent Food', c: '#39ff88' },
  { n: 'BEAUTIFUL!', c: '#00ffff' },
  { n: "I'll have to bring Danny here one day", c: '#ffe600' }
];

const FOODS = { kebab: 5, fish: 10, roast: 25 };
const CAPS = [
  "Look at the absolute size of that portion, fellas! Phrwoar.",
  "The crackling is elite.",
  "Swimming in proper thick gravy. Get a load of that.",
  "That is an absolute unit of a pie."
];

const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv ? cv.getContext('2d') : null, stage = $('stage');
const garyAudio = $('garyAudio');
const introAvatarCv = $('introAvatar'), introCtx = introAvatarCv.getContext('2d');

let K = 1, state = 'menu', score = 0, best = 0, tierMax = 0, lane = 1, target = 1, scrollY = 0, acc = 0, gap = 160;
let objs = [], fx = [], cap = null, mile = 0, crashT = 0, clock = 0, uid = 0;
let grinTimer = 0, stars = [];
let lastTierIndex = 0;

// Audio & Animation Variables
let audioCtx, analyser, dataArray;
let animTimer = 0, currentFrame = 0, introAnimTimer = 0;

// Image Preloading & Status Diagnostics
let openLoaded = false, closedLoaded = false, crashLoaded = false, shopLoaded = false;
let loadErrorLog = [];

const imgOpen = new Image();
imgOpen.onload = () => { openLoaded = true; };
imgOpen.onerror = () => { loadErrorLog.push('gary_open.png not found'); };
imgOpen.src = 'gary_open.png.PNG';

const imgShop = new Image();
imgShop.onload = () => { shopLoaded = true; };
imgShop.onerror = () => { loadErrorLog.push('chip_shop.png not found'); };
imgShop.src = 'chip_shop.PNG';

const imgClosed = new Image();
imgClosed.onload = () => { closedLoaded = true; };
imgClosed.onerror = () => { loadErrorLog.push('gary_closed.png not found'); };
imgClosed.src = 'gary_closed.png.PNG';

const imgCrash = new Image();
imgCrash.onload = () => { crashLoaded = true; };
imgCrash.onerror = () => { loadErrorLog.push('gary_crash.png not found'); };
imgCrash.src = 'gary_crash.png';

function getActiveImage(isOpen) {
  if (isOpen && openLoaded) return imgOpen;
  if (!isOpen && closedLoaded) return imgClosed;
  if (openLoaded) return imgOpen;
  if (closedLoaded) return imgClosed;
  return null;
}

function initAudio() {
  if (audioCtx) return;
  try {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AudioContext();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    dataArray = new Uint8Array(analyser.frequencyBinCount);
    
    const source = audioCtx.createMediaElementSource(garyAudio);
    source.connect(analyser);
    analyser.connect(audioCtx.destination);
  } catch(e) {
    console.warn("Audio Context init error:", e);
  }
}

try { best = +localStorage.getItem('garyBest') || 0; } catch(e){}

function tierOf(s) {
  if (s <= 50) return 0;
  if (s <= 150) return 1;
  if (s <= 300) return 2;
  if (s <= 500) return 3;
  return 4;
}

function lx(l) { return ROAD_LEFT + (l + 0.5) * LANE_WIDTH; }

function mk(fn) {
  const s = document.createElement('canvas');
  s.width = s.height = 120;
  const c = s.getContext('2d');
  c.translate(60, 60); c.lineJoin = 'round'; c.lineCap = 'round';
  fn(c); return s;
}

function dMush(c) {
  c.lineWidth = 3; c.strokeStyle = '#2b1810'; c.fillStyle = '#f5eedc';
  c.beginPath(); c.moveTo(-12, 5); c.lineTo(-10, 38); c.lineTo(10, 38); c.lineTo(12, 5); c.closePath(); c.fill(); c.stroke();
  c.fillStyle = '#8a5a36'; c.beginPath(); c.arc(0, 5, 32, Math.PI, 0); c.closePath(); c.fill(); c.stroke();
}
function dFork(c) {
  c.lineWidth = 3; c.strokeStyle = '#a0b0c0'; c.fillStyle = '#e8f2fc';
  c.beginPath(); c.fillRect(-6, -10, 12, 48); c.strokeRect(-6, -10, 12, 48);
  [-14, -6, 2, 10].forEach(x => { c.fillRect(x, -42, 4, 34); c.strokeRect(x, -42, 4, 34); });
  c.fillRect(-16, -12, 32, 8); c.strokeRect(-16, -12, 32, 8);
}
function dKebab(c) {
  c.lineWidth = 3; c.strokeStyle = '#4a2a10';
  c.fillStyle = '#5aa832'; [[-18, -6], [0, -12], [18, -6]].forEach(([x, y]) => { c.beginPath(); c.ellipse(x, y, 12, 8, 0, 0, 7); c.fill(); c.stroke(); });
  c.fillStyle = '#8a4b22'; [[-10, -14], [6, -16], [-2, -6], [12, -8]].forEach(([x, y]) => { c.beginPath(); c.ellipse(x, y, 11, 6, 0, 0, 7); c.fill(); c.stroke(); });
  c.fillStyle = '#d8322c'; [[-16, -12], [16, -14]].forEach(([x, y]) => { c.beginPath(); c.ellipse(x, y, 6, 4, 0, 0, 7); c.fill(); c.stroke(); });
  c.fillStyle = '#f2cf8c'; c.beginPath(); c.ellipse(0, 4, 28, 24, 0, 0, Math.PI); c.closePath(); c.fill(); c.stroke();
}
function dFish(c) {
  c.lineWidth = 3; c.strokeStyle = '#4a3208'; c.fillStyle = '#ffd23f';
  [[-18, -3, -.3], [-8, -6, -.1], [2, -8, .05], [12, -6, .2], [22, -3, .4]].forEach(([x, y, a]) => {
    c.save(); c.translate(x, y); c.rotate(a); c.fillRect(-3.5, -22, 7, 26); c.strokeRect(-3.5, -22, 7, 26); c.restore();
  });
  c.save(); c.translate(-2, -6); c.rotate(-.45); c.fillStyle = '#e9a23b';
  c.beginPath(); c.ellipse(0, 0, 24, 10, 0, 0, 7); c.fill(); c.stroke();
  c.beginPath(); c.moveTo(22, 0); c.lineTo(32, -8); c.lineTo(32, 8); c.closePath(); c.fill(); c.stroke();
  c.restore();
  c.fillStyle = '#fff'; c.beginPath(); c.moveTo(-26, 3); c.lineTo(26, 3); c.lineTo(20, 32); c.lineTo(-20, 32); c.closePath(); c.fill();
  c.fillStyle = '#1f5fbf';
  [-20, -8, 4, 16].forEach(x => { c.beginPath(); c.moveTo(x, 3); c.lineTo(x + 6, 3); c.lineTo((x + 6) * .79, 32); c.lineTo(x * .79, 32); c.closePath(); c.fill(); });
  c.beginPath(); c.moveTo(-26, 3); c.lineTo(26, 3); c.lineTo(20, 32); c.lineTo(-20, 32); c.closePath(); c.stroke();
}
function dRoast(c) {
  c.lineWidth = 3; c.strokeStyle = '#3a2a10';
  c.fillStyle = '#fff'; c.beginPath(); c.ellipse(0, 12, 38, 20, 0, 0, 7); c.fill(); c.stroke();
  c.fillStyle = '#e6edf4'; c.beginPath(); c.ellipse(0, 12, 28, 15, 0, 0, 7); c.fill();
  c.fillStyle = '#7a4318'; c.beginPath(); c.ellipse(3, 14, 21, 9, 0, 0, 7); c.fill();
  c.fillStyle = '#f0b640'; [[-24, 8], [-18, 16]].forEach(([x, y]) => { c.beginPath(); c.ellipse(x, y, 8, 5, .3, 0, 7); c.fill(); c.stroke(); });
  c.fillStyle = '#b4573f'; [[-8, 5, -.3], [3, 3, .1]].forEach(([x, y, a]) => { c.save(); c.translate(x, y); c.rotate(a); c.beginPath(); c.ellipse(0, 0, 13, 7, 0, 0, 7); c.fill(); c.stroke(); c.restore(); });
  c.fillStyle = '#e9b04f'; c.beginPath(); c.moveTo(12, 8); c.lineTo(15, -10); c.quadraticCurveTo(22, -18, 29, -10); c.lineTo(32, 8); c.quadraticCurveTo(22, 14, 12, 8); c.closePath(); c.fill(); c.stroke();
  c.fillStyle = '#4caf3a'; [[-5, 20], [2, 23], [-11, 23], [6, 18]].forEach(([x, y]) => { c.beginPath(); c.arc(x, y, 3, 0, 7); c.fill(); });
}

const SP = { m: mk(dMush), fork: mk(dFork), kebab: mk(dKebab), fish: mk(dFish), roast: mk(dRoast) };

function rr(c, x, y, w, h, r) {
  c.beginPath(); c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

function txt(s, x, y, size, col, al) {
  ctx.font = '900 ' + size + 'px "Arial Black",Impact,sans-serif';
  ctx.textAlign = al; ctx.textBaseline = 'middle';
  ctx.lineWidth = 4; ctx.lineJoin = 'round'; ctx.strokeStyle = 'rgba(0,0,0,.85)';
  ctx.strokeText(s, x, y); ctx.fillStyle = col; ctx.fillText(s, x, y);
}

function fbFace(c, r) {
  c.fillStyle = '#ffd166'; c.strokeStyle = '#4a2a10'; c.lineWidth = 4;
  c.beginPath(); c.arc(0, 0, r, 0, Math.PI * 2); c.fill(); c.stroke();
  c.fillStyle = '#222'; c.beginPath(); c.arc(-r * .35, -r * .2, r * .12, 0, Math.PI * 2); c.arc(r * .35, -r * .2, r * .12, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.arc(0, 0, r * .5, .15 * Math.PI, .85 * Math.PI); c.stroke();
}

function triggerGrin() {
  grinTimer = 1.3;
  const px = lx(lane);
  for (let i = 0; i < 20; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 40 + Math.random() * 90;
    const side = Math.random() < 0.5 ? -30 : 30;
    stars.push({ x: px + side, y: PLAYER_Y - 35, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: 0.6 + Math.random() * 0.5, maxLife: 1.1, size: 4 + Math.random() * 5 });
  }
}

function reset() {
  score = 0; tierMax = 0; lastTierIndex = 0; lane = target = 1; scrollY = 0; acc = 0; gap = 160;
  objs = []; fx = []; cap = null; mile = 0; crashT = 0; grinTimer = 0; stars = [];
}

function move(d) {
  if (state === 'play') target = Math.max(0, Math.min(2, target + d));
}

function spawnRow() {
  const L = [0, 1, 2].sort(() => Math.random() - .5);
  let i = 0;
  const add = (l, t) => objs.push({ t, l, y: -60, id: uid++ });
  const food = () => { const r = Math.random(); return r < .45 ? 'kebab' : r < .8 ? 'fish' : 'roast'; };
  const hazardType = () => Math.random() < 0.5 ? 'm' : 'fork';
  const hasH = Math.random() < .55;
  if (hasH) add(L[i++], hazardType());
  const nf = hasH ? (Math.random() < .6 ? 1 : 0) : (Math.random() < .5 ? 1 : 2);
  for (let k = 0; k < nf; k++) add(L[i++], food());
}

function collect(o) {
  const pts = FOODS[o.t];
  score += pts;
  fx.push({ x: lx(o.l), y: o.y, t: 0, life: 1.5, txt: '+' + pts });
  const currentTier = tierOf(score);
  let grin = o.t === 'roast';
  if (currentTier > lastTierIndex) { lastTierIndex = currentTier; grin = true; }
  if (grin) triggerGrin();
  tierMax = Math.max(tierMax, currentTier);
  if (score >= (mile + 1) * 40) {
    mile = Math.floor(score / 40);
    cap = { s: CAPS[Math.floor(Math.random() * CAPS.length)], t: 0 };
  }
}

function crash(hitType) {
  crashT = 0; cap = null; state = 'crash_' + hitType;
}

function endGame() {
  state = 'over';
  if (score > best) {
    best = score;
    try { localStorage.setItem('garyBest', best); } catch (e) {}
  }
  try {
    $('fScore').textContent = 'Score: ' + score;
    const T = TIERS[tierMax] || TIERS[TIERS.length - 1];
    $('fTier').textContent = 'Tier: ' + T.n;
    $('fTier').style.color = T.c;
    $('over').classList.add('show');
  } catch (e) {}
}

function startGameplay() {
  $('introOverlay').classList.remove('show');
  garyAudio.pause();
  garyAudio.currentTime = 0;
  reset();
  state = 'play';
}

function isTalkingAudio() {
  if (analyser && !garyAudio.paused) {
    analyser.getByteFrequencyData(dataArray);
    let sum = 0;
    for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
    return (sum / dataArray.length) > 18;
  }
  return false;
}

function update(dt) {
  clock += dt;
  lane += (target - lane) * Math.min(1, dt * 16);
  if (grinTimer > 0) grinTimer = Math.max(0, grinTimer - dt);

  for (let i = stars.length - 1; i >= 0; i--) {
    const s = stars[i];
    s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
    if (s.life <= 0) stars.splice(i, 1);
  }

  if (cap) { cap.t += dt; if (cap.t > 2.2) cap = null; }
  for (const f of fx) f.t += dt;
  fx = fx.filter(f => f.t < f.life);

  const speed = 200 + Math.floor(score / 80) * 15;

  if (state === 'menu' || state === 'intro') {
    scrollY = (scrollY + 120 * dt) % 640;
    return;
  }

  if (state.startsWith('crash')) {
    crashT += dt;
    if (crashT > 2.0) endGame();
    return;
  }

  if (state !== 'play') return;

  scrollY = (scrollY + speed * dt) % 640;
  acc += speed * dt;
  if (acc >= gap) {
    acc -= gap; gap = 140 + Math.random() * 80; spawnRow();
  }

  for (const o of objs) {
    o.y += speed * dt;
    if (!o.d && Math.abs(o.y - PLAYER_Y) < 32 && Math.abs(lane - o.l) < .55) {
      o.d = 1;
      if (o.t === 'm' || o.t === 'fork') { crash(o.t); return; }
      collect(o);
    }
  }
  objs = objs.filter(o => !o.d && o.y < H + 60);
}

function drawHighStreet() {
  ctx.fillStyle = '#1a1e24'; ctx.fillRect(0, 0, W, H);
  const totalH = 640, offY = scrollY % totalH;

  const drawSide = (isRight) => {
    const xBase = isRight ? ROAD_RIGHT : 0, w = isRight ? (W - ROAD_RIGHT) : ROAD_LEFT;
    for (let pass = -1; pass <= 1; pass++) {
      const py = pass * totalH + offY;
      
      if (!isRight && shopLoaded) {
        // Pre-fill building brick backdrop to eliminate black border on transparent asset
        ctx.fillStyle = '#8b3a2b';
        ctx.fillRect(xBase, py - 640, w, 200);
        ctx.drawImage(imgShop, xBase, py - 640, w, 200);
      } else {
        ctx.fillStyle = '#8b3a2b'; ctx.fillRect(xBase, py - 640, w, 200);
        ctx.fillStyle = '#2b1d14'; ctx.fillRect(xBase + 8, py - 580, w - 16, 50);
        ctx.fillStyle = '#fceabb'; ctx.fillRect(xBase + 12, py - 576, w - 24, 42);
        ctx.fillStyle = '#e82525'; ctx.fillRect(xBase + 4, py - 610, w - 8, 20);
        ctx.fillStyle = '#fff'; ctx.font = '900 10px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('CHIPPY', xBase + w / 2, py - 600);
      }

      // Middle shop (Bakers)
      ctx.fillStyle = '#5c4033'; ctx.fillRect(xBase, py - 440, w, 220);
      ctx.fillStyle = '#1c2833'; ctx.fillRect(xBase + 8, py - 380, w - 16, 60);
      ctx.fillStyle = '#fff8dc'; ctx.fillRect(xBase + 12, py - 376, w - 24, 52);
      ctx.fillStyle = '#28b463'; ctx.fillRect(xBase + 4, py - 415, w - 8, 20);
      ctx.fillStyle = '#fff'; ctx.fillText('BAKERS', xBase + w / 2, py - 405);

      // Bottom shop (Pub)
      ctx.fillStyle = '#34495e'; ctx.fillRect(xBase, py - 220, w, 220);
      ctx.fillStyle = '#1a252f'; ctx.fillRect(xBase + 8, py - 160, w - 16, 60);
      ctx.fillStyle = '#f9e79f'; ctx.fillRect(xBase + 12, py - 156, w - 24, 52);
      ctx.fillStyle = '#900c3f'; ctx.fillRect(xBase + 4, py - 195, w - 8, 22);
      ctx.fillStyle = '#ffe600'; ctx.fillText('THE RED LION', xBase + w / 2, py - 184);
    }
  };

  drawSide(false); drawSide(true);
}

function drawPavements() {
  const pWidth = 13.5, bh = 18, offY = scrollY % bh;
  for (let side = 0; side < 2; side++) {
    const x = side === 0 ? ROAD_LEFT - pWidth : ROAD_RIGHT;
    ctx.fillStyle = '#7f8c8d'; ctx.fillRect(x, 0, pWidth, H);
    ctx.strokeStyle = '#2c3e50'; ctx.lineWidth = 2;
    for (let y = -bh + offY; y < H + bh; y += bh) ctx.strokeRect(x, y, pWidth, bh);
  }
}

function drawRoad() {
  ctx.fillStyle = '#3a3f47'; ctx.fillRect(ROAD_LEFT, 0, ROAD_WIDTH, H);
  const dashH = 31.5, gapH = 22.5, totalD = dashH + gapH, offY = scrollY % totalD;
  ctx.fillStyle = '#ffffff';
  for (let l = 1; l <= 2; l++) {
    const lineX = ROAD_LEFT + l * LANE_WIDTH - 2.7;
    for (let y = -totalD + offY; y < H + totalD; y += totalD) ctx.fillRect(lineX, y, 5.4, dashH);
  }
}

function drawObj(o) {
  const x = lx(o.l), y = o.y;
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(x, y + 18, 20, 6, 0, 0, 7); ctx.fill();
  const bob = Math.sin(clock * 6 + o.id) * 3;
  ctx.drawImage(SP[o.t], x - 31.5, y - 31.5 + bob, 63, 63);
}

function drawIntroAvatar(dt) {
  introCtx.clearRect(0, 0, 180, 180);
  introCtx.fillStyle = '#111';
  introCtx.beginPath(); introCtx.arc(90, 90, 90, 0, Math.PI * 2); introCtx.fill();
  
  introAnimTimer += dt;
  let isOpen = isTalkingAudio();
  if (!garyAudio.paused) {
    const cyclePhase = Math.floor(introAnimTimer / 0.35) % 2;
    isOpen = cyclePhase === 1;
  }
  
  const img = getActiveImage(isOpen);
  if (img) {
    const ar = img.naturalWidth / img.naturalHeight;
    let h = 175, w = h * ar;
    if (w > 175) { w = 175; h = w / ar; }
    introCtx.drawImage(img, 90 - w / 2, 90 - h / 2, w, h);
  } else {
    introCtx.save();
    introCtx.translate(90, 90);
    fbFace(introCtx, 60);
    introCtx.restore();
  }
  
  introCtx.lineWidth = 6;
  introCtx.strokeStyle = '#ffe600';
  introCtx.beginPath(); introCtx.arc(90, 90, 86, 0, Math.PI * 2); introCtx.stroke();
}

function drawPlayer(dt) {
  const px = lx(lane), py = PLAYER_Y;
  
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath(); ctx.ellipse(px, py + 20, 29, 8, 0, 0, 7); ctx.fill();
  ctx.save();
  ctx.translate(px, py);
  
  const isCrashing = state.startsWith('crash');
  
  if (isCrashing) {
    const tiltProgress = Math.min(1, crashT / 0.3);
    const rotationAngle = tiltProgress * (Math.PI / 2);
    ctx.rotate(rotationAngle);
    ctx.translate(0, tiltProgress * 15);
  }

  let imgToDraw = null;
  if (isCrashing && crashLoaded) {
    imgToDraw = imgCrash;
  } else {
    let isOpen = false;
    if (cap !== null) {
      animTimer += dt;
      if (animTimer > 0.12) { currentFrame = currentFrame === 0 ? 1 : 0; animTimer = 0; }
      isOpen = currentFrame === 1;
    }
    imgToDraw = getActiveImage(isOpen);
  }

  let w = 72, h = 72;
  if (imgToDraw) {
    const ar = imgToDraw.naturalWidth / imgToDraw.naturalHeight;
    w = h * ar; 
    if (w > 72) { w = 72; h = w / ar; }
    ctx.drawImage(imgToDraw, -w / 2, -h / 2, w, h);
  } else {
    fbFace(ctx, 36);
  }
  ctx.restore();
  
  for (const s of stars) {
    const p = s.life / s.maxLife;
    ctx.save(); ctx.fillStyle = Math.floor(clock * 20) % 2 ? '#ffe600' : '#ffffff'; ctx.globalAlpha = Math.max(0, p);
    ctx.beginPath(); ctx.arc(s.x, s.y, s.size * p, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}

function drawDiagnostics() {
  if (loadErrorLog.length > 0) {
    ctx.fillStyle = 'rgba(255, 0, 0, 0.85)';
    ctx.fillRect(0, 0, W, 24 * loadErrorLog.length + 8);
    ctx.fillStyle = '#fff';
    ctx.font = '11px monospace';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    loadErrorLog.forEach((err, idx) => {
      ctx.fillText('⚠️ ERROR: ' + err, 10, 6 + idx * 22);
    });
  }
}

function drawHud() {
  const T = TIERS[tierOf(score)];
  ctx.fillStyle = 'rgba(10,12,20,.85)';
  rr(ctx, 10, 10, 340, 38, 10); ctx.fill();
  ctx.strokeStyle = T.c; ctx.lineWidth = 3; ctx.stroke();
  txt('Tier: ' + T.n, CX, 29, 13, T.c, 'center');
  txt('SCORE ' + score, 20, 70, 18, '#fff', 'left');
  txt('BEST ' + best, 340, 70, 13, '#cfd6e0', 'right');
}

function drawCap() {
  if (!cap) return;
  const t = cap.t, a = t > 1.8 ? 1 - (t - 1.8) / .4 : 1;
  ctx.save(); ctx.globalAlpha = Math.max(0, a);
  ctx.translate(CX, 240 + Math.sin(t * 6) * 3);
  ctx.font = '900 18px "Arial Black",sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const fit = Math.min(1, 310 / ctx.measureText(cap.s).width);
  ctx.scale(fit, fit);
  ctx.lineJoin = 'round'; ctx.lineWidth = 7; ctx.strokeStyle = '#1b0326';
  ctx.strokeText(cap.s, 0, 0); ctx.fillStyle = '#ffe600'; ctx.fillText(cap.s, 0, 0);
  ctx.restore();
}

function drawBubble() {
  const s = Math.min(1, crashT * 6), px = lx(lane), bx = Math.max(115, Math.min(245, px)), by = 380, bw = 240, bh = 110;
  ctx.save(); ctx.translate(bx, by); ctx.scale(s, s);
  const tx = Math.max(-80, Math.min(80, px - bx)), ty = PLAYER_Y - 60 - by;
  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#111'; ctx.lineWidth = 4; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(-14, bh / 2 - 2); ctx.lineTo(tx, ty); ctx.lineTo(14, bh / 2 - 2); ctx.closePath(); ctx.fill(); ctx.stroke();
  rr(ctx, -bw / 2, -bh / 2, bw, bh, 20); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.fillRect(-12, bh / 2 - 4, 24, 7);
  ctx.fillStyle = '#111'; ctx.font = '900 15px "Arial Black",sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (state === 'crash_fork') {
    ctx.fillText("You can't tackle a", 0, -22);
    ctx.fillText("premium dinner with a plastic", 0, 0);
    ctx.fillText("fork! Unprofessional!", 0, 22);
  } else {
    ctx.fillText("Right, that's", 0, -18);
    ctx.fillText("absolutely", 0, 4);
    ctx.fillText("ruined it!", 0, 26);
  }
  ctx.restore();
}

function render(dt) {
  if (state === 'intro') drawIntroAvatar(dt);

  ctx.setTransform(K, 0, 0, K, 0, 0);
  ctx.save();
  drawHighStreet(); drawPavements(); drawRoad();
  
  if (state !== 'menu' && state !== 'intro') {
    for (let i = objs.length - 1; i >= 0; i--) drawObj(objs[i]);
    drawPlayer(dt);
    for (const f of fx) {
      const k = f.t / f.life;
      ctx.save(); ctx.globalAlpha = 1 - k; ctx.strokeStyle = '#ffe600'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(f.x, f.y, 8 + k * 20, 0, 7); ctx.stroke();
      ctx.restore();
      ctx.save(); ctx.globalAlpha = 1 - k * k;
      txt(f.txt, f.x, f.y - k * 25, 16, '#ffe600', 'center');
      ctx.restore();
    }
  }
  ctx.restore();
  if (state !== 'menu' && state !== 'intro') {
    drawHud(); drawCap();
    if (state.startsWith('crash') || state === 'over') {
      if (state.startsWith('crash')) {
        ctx.fillStyle = 'rgba(255,40,40,' + Math.max(0, .45 - crashT) + ')';
        ctx.fillRect(0, 0, W, H);
      }
      drawBubble();
    }
  }
  drawDiagnostics();
}

addEventListener('keydown', e => {
  if (e.repeat) return;
  const k = e.key.toLowerCase();
  if (k === 'arrowleft' || k === 'a') move(-1);
  else if (k === 'arrowright' || k === 'd') move(1);
  else return;
  if (state === 'play') e.preventDefault();
});

cv.addEventListener('pointerdown', e => {
  if (state !== 'play') return;
  const r = cv.getBoundingClientRect();
  move(e.clientX - r.left < r.width / 2 ? -1 : 1);
  e.preventDefault();
});

$('startBtn').addEventListener('click', e => {
  e.currentTarget.blur();
  initAudio();
  $('menu').classList.remove('show');
  state = 'intro';
  introAnimTimer = 0;
  $('introOverlay').classList.add('show');
  
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  
  garyAudio.currentTime = 0;
  const playPromise = garyAudio.play();
  
  if (playPromise !== undefined) {
    playPromise.catch(err => {
      console.warn("Autoplay blocked or audio missing:", err);
      setTimeout(() => {
        if (state === 'intro') startGameplay();
      }, 2500);
    });
  }

  garyAudio.onended = () => {
    startGameplay();
  };
});

$('skipIntroBtn').addEventListener('click', () => {
  startGameplay();
});

$('againBtn').addEventListener('click', e => {
  e.currentTarget.blur();
  $('over').classList.remove('show');
  reset();
  state = 'menu';
  $('menu').classList.add('show');
});

function resize() {
  const w = stage.clientWidth, dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  cv.width = Math.round(w * dpr); cv.height = Math.round(w * 16 / 9 * dpr); K = cv.width / W;
  ctx.imageSmoothingQuality = 'high';
}

let last = performance.now();
function loop(ts) {
  const dt = Math.max(0, Math.min(.05, (ts - last) / 1000)); last = ts;
  update(dt);
  render(dt);
  requestAnimationFrame(loop);
}

addEventListener('resize', resize);
resize();
requestAnimationFrame(loop);
})();
</script>

</body>
</html>
