<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2f353f">
<title>Gary Eats: The Runner</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
:root{--w:min(100vw,calc(100vh*9/16))}
@supports(height:100dvh){:root{--w:min(100vw,calc(100dvh*9/16))}}
html,body{height:100%;background:#2f353f;overflow:hidden;touch-action:none}
body{display:flex;align-items:center;justify-content:center;font-family:'Arial Black',Impact,'Segoe UI',sans-serif;color:#fff}
#stage{--u:3.6px;position:relative;width:var(--w);height:calc(var(--w)*16/9);background:#111;overflow:hidden;box-shadow:0 0 0 1px #0006,0 0 70px #000a}
canvas{display:block;width:100%;height:100%;touch-action:none}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*3.5);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .5s ease,transform .5s ease,visibility 0s .5s}
.screen.show{opacity:1;visibility:visible;pointer-events:auto;transform:none;transition:opacity .5s ease,transform .5s ease,visibility 0s}
#menu{transform:scale(1.5);background:radial-gradient(ellipse at 50% 45%,rgba(10,12,24,.3),rgba(10,12,24,.82))}
#over{transform:scale(.92);background:rgba(8,10,20,.74);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);padding:0 calc(var(--u)*6)}
h1{text-align:center;font-size:calc(var(--u)*10.4);line-height:1.02;color:#fff36b;-webkit-text-stroke:calc(var(--u)*.45) #4a1200;paint-order:stroke fill;text-shadow:0 calc(var(--u)*.9) 0 #d3390b,0 0 calc(var(--u)*5) rgba(255,214,0,.75)}
h1 span{display:block}
h1 span+span{color:#ff6a3d}

#faceWrap{width:calc(var(--u)*46);height:calc(var(--u)*46);display:flex;align-items:center;justify-content:center;animation:bob 2.4s ease-in-out infinite;filter:drop-shadow(0 calc(var(--u)*1.5) calc(var(--u)*2) rgba(0,0,0,.6));overflow:hidden;border-radius:50%;background:#ffe600}
#grinVid{width:100%;height:100%;object-fit:cover;display:block}
#menuFb{display:none;font-size:calc(var(--u)*32);align-items:center;justify-content:center}

@keyframes bob{0%,100%{transform:rotate(-9deg) scale(.93)}50%{transform:rotate(9deg) scale(1.09)}}
.arcade{font:inherit;font-size:calc(var(--u)*6.2);line-height:1.1;width:calc(var(--u)*84);padding:calc(var(--u)*3.6) calc(var(--u)*4);border:calc(var(--u)*.7) solid #fff;border-radius:calc(var(--u)*4.5);background:#eaff00;color:#1b1b1b;text-transform:uppercase;cursor:pointer;box-shadow:0 calc(var(--u)*1.6) 0 #8a9a00,0 0 calc(var(--u)*5) #eaff00;animation:pulse 1.1s ease-in-out infinite;transition:transform .08s}
.arcade:active{transform:translateY(calc(var(--u)*1.2));box-shadow:0 calc(var(--u)*.4) 0 #8a9a00,0 0 calc(var(--u)*3) #eaff00}
.arcade:focus-visible{outline:calc(var(--u)*.8) solid #fff;outline-offset:calc(var(--u)*.8)}
@keyframes pulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.18)}}
.hint{font:600 calc(var(--u)*3.3)/1.3 'Segoe UI',Arial,sans-serif;color:#cfd6e0;text-align:center;width:calc(var(--u)*80)}
h2{text-align:center;font-size:calc(var(--u)*15);line-height:1;color:#ff5a36;-webkit-text-stroke:calc(var(--u)*.5) #3a0a00;paint-order:stroke fill;text-shadow:0 calc(var(--u)*1) 0 #7c1d05}
h2 span{display:block;font-size:calc(var(--u)*8.5);color:#fff;margin-top:calc(var(--u)*1.5);-webkit-text-stroke:0;text-shadow:0 calc(var(--u)*.6) 0 #000a}
.stat{font-size:calc(var(--u)*5.2);text-align:center;line-height:1.25}
.stat small{display:block;font:700 calc(var(--u)*3.4) 'Segoe UI',Arial,sans-serif;color:#aab3c2}
.stat b{color:#ffe600;font-size:calc(var(--u)*11);display:block}
#fTier{font-size:calc(var(--u)*5.4);color:#39ff88;font-weight:bold;text-align:center;display:block;margin-top:calc(var(--u)*1)}
#promo{width:100%;border:calc(var(--u)*.6) dashed #ffe600;background:rgba(255,230,0,.13);border-radius:calc(var(--u)*3);padding:calc(var(--u)*3);font:700 calc(var(--u)*4.2)/1.35 'Segoe UI',Arial,sans-serif;text-align:center}
#promo b{color:#ffe600;font-family:'Arial Black',Impact,sans-serif}
@media(prefers-reduced-motion:reduce){#faceWrap,.arcade{animation:none}.screen{transition:none}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>

  <div id="menu" class="screen show">
    <h1><span>GARY EATS:</span> <span>THE RUNNER</span></h1>
    <div id="faceWrap">
      <video id="grinVid" src="grin.mp4" autoplay muted loop playsinline></video>
      <div id="menuFb">&#128523;</div>
    </div>
    <button id="startBtn" class="arcade">LET'S GIVE IT A GO!</button>
    <p class="hint">Tap the left or right half of the screen, or use A / D or the arrow keys, to change lane.</p>
  </div>

  <div id="over" class="screen">
    <h2>STUFFED! <span>Game Over</span></h2>
    <div class="stat"><small>Final score</small><b id="fScore">0</b></div>
    <div class="stat"><small>Highest rating reached</small><span id="fTier"></span></div>
    <div id="promo">Use code <b>GARYEATS10</b> for 10% off your next takeaway!</div>
    <button id="againBtn" class="arcade">PLAY AGAIN</button>
  </div>
</div>

<script>
(()=>{
'use strict';
const W=360, H=640;
const ROAD_LEFT=75, ROAD_RIGHT=285, ROAD_WIDTH=210;
const LANE_WIDTH = ROAD_WIDTH / 3;
const LANE_CENTERS = [
  ROAD_LEFT + LANE_WIDTH * 0.5,
  ROAD_LEFT + LANE_WIDTH * 1.5,
  ROAD_LEFT + LANE_WIDTH * 2.5
];
const PLAYER_Y = 540;

const TIERS = [
  { n: 'Absolute Rubbish', c: '#ff4d4d' },
  { n: 'Bit Dry, Needs Salt', c: '#ffb02e' },
  { n: 'Proper Decent Food', c: '#39ff88' },
  { n: 'BEAUTIFUL!', c: '#00ffff' },
  { n: "I'll have to bring Danny here one day", c: '#ffe600' }
];

const FOODS = { kebab: 5, fish: 10, roast: 25 };

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
canvas.width = W;
canvas.height = H;

let state = 'MENU';
let score = 0;
let lane = 1;
let playerX = LANE_CENTERS[1];
let speed = 4;
let roadScroll = 0;
let items = [];
let particles = [];
let spawnTimer = 0;
let highestTierIdx = 0;

// Setup video error handling to switch to fallback emoji if grin.mp4 isn't found locally
const grinVid = document.getElementById('grinVid');
const menuFb = document.getElementById('menuFb');
grinVid.onerror = () => {
  grinVid.style.display = 'none';
  menuFb.style.display = 'flex';
};

// Ensure video attempts to play immediately
grinVid.play().catch(() => {
  // Handles browser autoplay blocks gracefully by falling back or showing controls/muted play
});

function getTier(s) {
  if (s >= 300) return 4;
  if (s >= 180) return 3;
  if (s >= 90) return 2;
  if (s >= 30) return 1;
  return 0;
}

function startGame() {
  score = 0;
  lane = 1;
  playerX = LANE_CENTERS[1];
  speed = 4;
  items = [];
  particles = [];
  spawnTimer = 0;
  highestTierIdx = 0;
  
  document.getElementById('menu').classList.remove('show');
  document.getElementById('over').classList.remove('show');
  state = 'PLAY';
}

function gameOver() {
  state = 'OVER';
  document.getElementById('fScore').innerText = score;
  const tierObj = TIERS[highestTierIdx];
  const fTier = document.getElementById('fTier');
  fTier.innerText = tierObj.n;
  fTier.style.color = tierObj.c;
  document.getElementById('over').classList.add('show');
  
  // Make sure video loops again back on menu screen
  grinVid.play().catch(()=>{});
}

// Controls
window.addEventListener('keydown', e => {
  if (state !== 'PLAY') return;
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
    if (lane > 0) lane--;
  } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
    if (lane < 2) lane++;
  }
});

canvas.addEventListener('pointerdown', e => {
  if (state !== 'PLAY') return;
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  if (x < rect.width / 2) {
    if (lane > 0) lane--;
  } else {
    if (lane < 2) lane++;
  }
});

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('againBtn').addEventListener('click', startGame);

let lastTime = 0;
function loop(timestamp) {
  if (!lastTime) lastTime = timestamp;
  const dt = timestamp - lastTime;
  lastTime = timestamp;

  update(dt);
  render();

  requestAnimationFrame(loop);
}

function update(dt) {
  if (state !== 'PLAY') return;

  const targetX = LANE_CENTERS[lane];
  playerX += (targetX - playerX) * 0.25;

  roadScroll = (roadScroll + speed) % 40;
  speed = 4 + Math.floor(score / 50) * 0.5;

  spawnTimer++;
  if (spawnTimer > Math.max(30, 70 - speed * 3)) {
    spawnTimer = 0;
    const l = Math.floor(Math.random() * 3);
    const keys = Object.keys(FOODS);
    const type = keys[Math.floor(Math.random() * keys.length)];
    items.push({ lane: l, y: -40, type: type });
  }

  for (let i = items.length - 1; i >= 0; i--) {
    items[i].y += speed;
    const it = items[i];

    if (it.y > PLAYER_Y - 30 && it.y < PLAYER_Y + 30 && it.lane === lane) {
      score += FOODS[it.type];
      const curTier = getTier(score);
      if (curTier > highestTierIdx) highestTierIdx = curTier;
      
      for (let p = 0; p < 8; p++) {
        particles.push({
          x: LANE_CENTERS[it.lane],
          y: PLAYER_Y,
          vx: (Math.random() - 0.5) * 4,
          vy: (Math.random() - 0.5) * 4 - 2,
          life: 20,
          color: TIERS[curTier].c
        });
      }
      
      items.splice(i, 1);
      continue;
    }

    if (it.y > H + 50) {
      items.splice(i, 1);
    }
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const pt = particles[i];
    pt.x += pt.vx;
    pt.y += pt.vy;
    pt.life--;
    if (pt.life <= 0) particles.splice(i, 1);
  }
}

function render() {
  ctx.clearRect(0, 0, W, H);
  if (state === 'MENU') return;

  ctx.fillStyle = '#1c2128';
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = '#2b313b';
  ctx.fillRect(ROAD_LEFT, 0, ROAD_WIDTH, H);

  ctx.strokeStyle = '#3d4655';
  ctx.lineWidth = 4;
  ctx.setLineDash([20, 20]);
  ctx.lineDashOffset = -roadScroll;
  ctx.beginPath();
  ctx.moveTo(ROAD_LEFT + LANE_WIDTH, 0);
  ctx.lineTo(ROAD_LEFT + LANE_WIDTH, H);
  ctx.moveTo(ROAD_LEFT + LANE_WIDTH * 2, 0);
  ctx.lineTo(ROAD_LEFT + LANE_WIDTH * 2, H);
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.fillStyle = '#ff5a36';
  ctx.fillRect(ROAD_LEFT - 8, 0, 8, H);
  ctx.fillRect(ROAD_RIGHT, 0, 8, H);

  items.forEach(it => {
    const ix = LANE_CENTERS[it.lane];
    ctx.font = '28px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    let icon = '🍗';
    if (it.type === 'fish') icon = '🐟';
    if (it.type === 'roast') icon = '🥩';
    ctx.fillText(icon, ix, it.y);
  });

  // Player drawing
  ctx.fillStyle = '#ffe600';
  ctx.beginPath();
  ctx.arc(playerX, PLAYER_Y, 26, 0, Math.PI * 2);
  ctx.fill();
  ctx.lineWidth = 4;
  ctx.strokeStyle = '#1b1b1b';
  ctx.stroke();

  ctx.fillStyle = '#1b1b1b';
  ctx.fillRect(playerX - 10, PLAYER_Y - 6, 6, 6);
  ctx.fillRect(playerX + 4, PLAYER_Y - 6, 6, 6);
  ctx.beginPath();
  ctx.arc(playerX, PLAYER_Y + 6, 8, 0, Math.PI);
  ctx.stroke();

  particles.forEach(pt => {
    ctx.fillStyle = pt.color;
    ctx.fillRect(pt.x, pt.y, 4, 4);
  });

  ctx.font = '900 22px "Arial Black", Impact, sans-serif';
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'left';
  ctx.fillText(`SCORE: ${score}`, 20, 40);

  const tIdx = getTier(score);
  const tier = TIERS[tIdx];
  ctx.font = '700 14px "Segoe UI", Arial, sans-serif';
  ctx.fillStyle = tier.c;
  ctx.fillText(tier.n, 20, 65);
}

requestAnimationFrame(loop);
})();
</script>
</body>
</html>
