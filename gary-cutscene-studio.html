<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101924"><title>Gary Eats! Cutscene Studio</title><link rel="stylesheet" href="gary-cutscene-studio.css"></head><body>
<header><a class="brand" href="./">GARY EATS! <span>Cutscene Studio</span></a><span id="saveStatus" role="status">Opening your project…</span></header>
<main><section class="preview-column"><div class="preview-heading"><span>LIVE PREVIEW</span><button id="fullscreen" class="quiet">Expand</button></div><div id="previewFrame"><div id="previewHost"></div><button id="closePreview" hidden>Close preview</button></div><div class="preview-actions"><button id="playScene">Play scene</button><button id="playBeat" class="quiet">From selected line</button></div><p class="muted tiny">The banner covers about a third of the screen. The game world remains visible.</p></section>
<section class="edit-column"><div class="project-row"><label>Scene<select id="sceneSelect"></select></label><button id="newScene" class="quiet">+ Scene</button><button id="duplicateScene" class="quiet">Duplicate</button></div>
<nav id="tabs" aria-label="Cutscene editor"><button data-tab="dialogue" class="active">Dialogue</button><button data-tab="scene">Scene</button><button data-tab="characters">Characters</button><button data-tab="files">Files</button><button data-tab="publish">Publish</button></nav>
<section id="pane"></section><div id="notice" class="notice" role="status" hidden></div></section></main>
<script src="gary-cutscene-runtime.js?v=aligned6"></script><script src="gary-cutscene-publisher.js?v=3"></script><script src="gary-cutscene-studio.js?v=aligned6"></script></body></html>
